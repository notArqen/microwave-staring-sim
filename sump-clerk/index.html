<style>
  html,body{margin:0;height:100%;background:#0d0609;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}

<body>
<script src="../three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script>
/* SUMP CLERK. Keep it level.
 * URL flags (testing): ?mute  ?auto (start at once, no audio)  ?speed=8  ?h=300 (render height, capped at native) */
const Q = new URLSearchParams(location.search);
const SPEED = +Q.get('speed') || 1, LOWH = +Q.get('h') || 300, AUTO = Q.has('auto'), MUTE = Q.has('mute') || AUTO;
const TAGLINE = 'KEEP IT LEVEL.';

/* ---------- renderer: low-res target, never above native ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030105);
const cam = new THREE.PerspectiveCamera(40, 1, .05, 30);
const snapRes = { value: new THREE.Vector2(160, 150) };
const rt = new THREE.WebGLRenderTarget(320, 300, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const hud = { c: document.createElement('canvas') }; hud.g = hud.c.getContext('2d');
hud.tx = new THREE.CanvasTexture(hud.c); hud.tx.minFilter = hud.tx.magFilter = THREE.NearestFilter; hud.tx.generateMipmaps = false;
let RW = 320, RH = 300, hudKey = '';

const post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: rt.texture }, hud: { value: hud.tx }, res: { value: new THREE.Vector2(320, 300) }, time: { value: 0 }, boost: { value: 1.9 }, fade: { value: 1 }, blk: { value: 0 }, ca: { value: 0 }, vigK: { value: 1.35 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: `
    precision highp float; uniform sampler2D t, hud; uniform vec2 res; uniform float time, boost, fade, blk, ca, vigK; varying vec2 vUv;
    float b2(vec2 a){ a=floor(a); return fract(a.x/2.+a.y*a.y*.75); }
    float b4(vec2 a){ return b2(.5*a)*.25+b2(a); }
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    vec3 pal(float i){
      if(i<.5) return vec3(.05,.025,.04); if(i<1.5) return vec3(.19,.08,.10); if(i<2.5) return vec3(.35,.28,.25);
      if(i<3.5) return vec3(.55,.38,.38); if(i<4.5) return vec3(.71,.57,.50); return vec3(.86,.76,.64); }
    void main(){
      vec2 px = floor(vUv*res), uv = (px+.5)/res;
      vec2 dv = vUv - .5; float dl = length(dv); vec2 co = (dl > .0001 ? dv / dl : vec2(0.)) * ca / res * dl * 2.;   /* aberration grows toward the edges */
      vec3 c = vec3(texture2D(t, uv + co).r, texture2D(t, uv).g, texture2D(t, uv - co).b) * boost; if(blk > .5) c = vec3(0.);
      vec4 hu = texture2D(hud,uv); c = mix(c, hu.rgb, hu.a);
      float l = pow(dot(c, vec3(.3,.59,.11)), .72);
      float d = (b4(px)-.47)*.2;
      vec3 p = pal(clamp(floor((l+d)*6.+.5), 0., 5.));
      vec3 o = mix(p, p*clamp(c/(l+.03), .45, 2.2), .5);
      float bl = c.b - max(c.r, c.g)*1.15 + d*.7;                         /* the one accent: a dirty cold blue */
      if(bl > .16){
        float q = floor(clamp((bl-.16)*1.2 + (h(px)-.5)*.28, 0., .999)*3.)/2.;
        vec3 blue = q<.25 ? vec3(.012,.02,.13) : q<.75 ? vec3(.045,.085,.34) : vec3(.10,.17,.50);
        o = mix(o, blue, clamp((bl-.16)*2.4, 0., 1.));
      }
      o = floor(o*7.+.5)/7.;
      o += (h(px+floor(time*12.))-.5)*.045;
      vec2 q2 = vUv-.5; o *= 1.-dot(q2,q2)*vigK;
      gl_FragColor = vec4(o*fade,1.);
    }`
});
post.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

function resize(){
  const W = Math.max(1, Math.round(innerWidth * devicePixelRatio)), H = Math.max(1, Math.round(innerHeight * devicePixelRatio));
  renderer.setSize(W, H, false);
  RH = Math.min(LOWH, H); RW = Math.min(W, Math.max(1, Math.round(RH * W / H)));   // <= native, always
  rt.setSize(RW, RH); postMat.uniforms.res.value.set(RW, RH); snapRes.value.set(RW / 2, RH / 2);
  hud.c.width = RW; hud.c.height = RH; hud.tx.dispose(); hudKey = '';
  cam.aspect = W / H;
  cam.fov = cam.aspect < 1.4 ? 2 * Math.atan(Math.tan(20 * Math.PI / 180) * 1.4 / cam.aspect) * 180 / Math.PI : 40;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- materials: vertex snap + grime textures ---------- */
function snap(m){
  m.onBeforeCompile = s => {
    s.uniforms.uSnap = snapRes;
    s.vertexShader = 'uniform vec2 uSnap;\n' + s.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n gl_Position.xy = floor(gl_Position.xy/gl_Position.w*uSnap+.5)/uSnap*gl_Position.w;');
  };
  return m;
}
const lam = (color, map) => snap(new THREE.MeshLambertMaterial(map ? { map } : { color }));
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function tex(size, cols, contrast, rep, extra){
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const k = 8, L = Array.from({ length: k * k }, rnd), hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), rc = cols.map(hex);
  const img = g.createImageData(size, size), at = (a, b) => L[(b % k) * k + (a % k)];
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
    const fx = x / size * k, fy = y / size * k, x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
    const v0 = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * tx, v1 = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * tx;
    const v = Math.min(.999, Math.max(0, (v0 + (v1 - v0) * ty - .5) * contrast + .5)), col = rc[(v * rc.length) | 0];
    img.data.set([col[0], col[1], col[2], 255], (y * size + x) * 4);
  }
  g.putImageData(img, 0, 0); if(extra) extra(g, size);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); return t;
}
const drips = (g, s, col, n) => { for(let i = 0; i < n; i++){ g.fillStyle = col; g.fillRect((rnd() * s) | 0, (rnd() * s) | 0, 1, 3 + ((rnd() * 10) | 0)); } };
const tileTex = tex(64, ['#2a2224', '#3a3032', '#4a3f3e'], 2.6, [7, 2.2], (g, s) => {
  g.fillStyle = '#140e11'; for(let i = 0; i < s; i += 16){ g.fillRect(i, 0, 1, s); g.fillRect(0, i, s, 1); }
  drips(g, s, '#1d1a14', 10); });
const rustTex = tex(32, ['#2e2523', '#4a392f', '#6b5240'], 2.8, [1, 1], (g, s) => drips(g, s, '#7c4a2a', 6));
const floorTex = tex(32, ['#1d1517', '#2d2224', '#3b2e2f'], 1.6, [8, 5], (g, s) => { g.fillStyle = '#120c0e'; g.fillRect(0, 0, s, 1); g.fillRect(0, 0, 1, s); g.fillRect(s / 2, s / 2, s / 2, s / 2); });
const woodTex = tex(32, ['#2b1c17', '#44302a', '#5a4236'], 1.6, [2, 1], (g, s) => { g.fillStyle = '#1c110e'; for(let y = 4; y < s; y += 7) g.fillRect(0, y, s, 1); });
const ledgerTex = tex(32, ['#8b7a62', '#a89578', '#b9a789'], 1.2, [1, 1], (g, s) => { g.fillStyle = '#3c2f2a'; for(let y = 4; y < s; y += 4) g.fillRect(3, y, s - 6, 1); g.fillStyle = '#6b1c1c'; g.fillRect(9, 0, 1, s); });

/* ---------- the room ---------- */
const WZ = -.6, GX = [-.95, -.35, .25];
function box(w, h, d, mat, x, y, z, parent = scene){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; }
function cyl(r, rb, h, seg, mat, x, y, z, parent = scene, rx = 0){ const m = new THREE.Mesh(new THREE.CylinderGeometry(r, rb, h, seg), mat); m.position.set(x, y, z); m.rotation.x = rx; parent.add(m); return m; }
function plane(w, h, mat, x, y, z, rx = 0, ry = 0){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); scene.add(m); return m; }

plane(8, 2.4, lam(0, tileTex), .5, .55, WZ);                                        // back wall
plane(4, 2.4, lam(0, tileTex), -2.6, .55, 1.4, 0, Math.PI / 2);
plane(4, 2.4, lam(0, tileTex), 3.2, .55, 1.4, 0, -Math.PI / 2);
plane(8, 4, lam(0, floorTex), .5, -.75, 1.4, -Math.PI / 2);
plane(8, 4, lam(0x241a1c), .5, 1.6, 1.4, Math.PI / 2);
box(3.6, .06, .9, lam(0, woodTex), .3, -.03, -.12);                                 // desk
box(3.6, .6, .05, lam(0x201618), .3, -.35, .3);
[-1.4, 2].forEach(x => box(.08, .8, .08, lam(0x201618), x, -.4, -.45));
[-1.45, -.65, 1.78, 2.4].forEach((x, i) => {                                          // pipes, with flanges
  cyl(.05, .05, 2.4, 8, lam(0, rustTex), x, .55, WZ + .06);
  [-.2, .7, 1.4].forEach(y => cyl(.075, .075, .05, 8, lam(0x2a2220), x, y, WZ + .06));
});
cyl(.045, .045, 8, 8, lam(0, rustTex), .5, 1.35, WZ + .08, scene, 0).rotation.z = Math.PI / 2;
cyl(.04, .04, 8, 8, lam(0, rustTex), .5, .05, WZ + .05, scene, 0).rotation.z = Math.PI / 2;
const ledger = box(.26, .02, .34, lam(0, ledgerTex), -.3, .01, .12); ledger.rotation.y = .25;
cyl(.04, .035, .09, 7, lam(0x4a3a30), .35, .045, .1);                                // mug
const shade = cyl(.04, .17, .13, 8, lam(0x2a2220), -.15, 1.0, -.05);
cyl(.006, .006, 1, 5, lam(0x111111), -.15, 1.56, -.05);

/* gauges */
const gauges = [];
function makeGauge(x, y, r, withValve, label){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const tx = new THREE.CanvasTexture(c); tx.minFilter = tx.magFilter = THREE.NearestFilter; tx.generateMipmaps = false;
  const group = new THREE.Group(); scene.add(group);
  box(r * 2.6, r * 2.8, .04, lam(0, rustTex), x, y, WZ + .02, group);
  cyl(r * 1.1, r * 1.1, .05, 10, lam(0x2c2422), x, y, WZ + .06, group, Math.PI / 2);
  const faceMat = new THREE.MeshBasicMaterial({ map: tx });
  const face = new THREE.Mesh(new THREE.CircleGeometry(r, 10), faceMat); face.position.set(x, y, WZ + .088); group.add(face);
  const G = { c, g: c.getContext('2d'), tx, faceMat, group, label, p: .5, x, y };
  if(withValve){
    const w = new THREE.Group(); w.position.set(x, .2, WZ + .11); scene.add(w);
    cyl(.02, .02, .08, 6, lam(0x2c2422), 0, 0, -.04, w, Math.PI / 2);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.075, .01, 4, 8), lam(0x6b5240)); w.add(rim);
    box(.15, .014, .014, lam(0x6b5240), 0, 0, 0, w); box(.014, .15, .014, lam(0x6b5240), 0, 0, 0, w);
    const pick = new THREE.Mesh(new THREE.CircleGeometry(.12, 8), new THREE.MeshBasicMaterial({ visible: false })); pick.position.z = .02; w.add(pick);
    pick.userData.i = gauges.length; G.wheel = w; G.pick = pick;
    const pc = document.createElement('canvas'); pc.width = 64; pc.height = 24;
    const ptx = new THREE.CanvasTexture(pc); ptx.minFilter = ptx.magFilter = THREE.NearestFilter; ptx.generateMipmaps = false;
    const pm = new THREE.MeshBasicMaterial({ map: ptx });
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(.27, .1), pm); pl.position.set(x, .065, WZ + .095); group.add(pl);
    G.plate = { g: pc.getContext('2d'), tx: ptx, mat: pm, last: 99 };
  }
  return G;
}
GX.forEach((x, i) => gauges.push(makeGauge(x, .58, .17, true, i + 1)));
/* the fourth: bare wall, clean patch, no pipe, no valve, nothing to turn */
const g4 = makeGauge(1.3, .62, .13, false, 0);
box(.5, .5, .005, lam(0x4d4140), 1.3, .62, WZ + .004, g4.group);

/* posters: two hang over the fourth gauge and come down at 03:00; two more stay up so the wall feels used */
function makePoster(x, y, w, h, tilt, lines, hdr, big){
  const c = document.createElement('canvas'); c.width = Math.round(w * 100); c.height = Math.round(h * 100); const g = c.getContext('2d');
  g.fillStyle = '#b8a88a'; g.fillRect(0, 0, c.width, c.height);
  for(let i = 0; i < 40; i++){ g.fillStyle = ['#a8977a', '#9a8a6c', '#c4b698'][i % 3]; g.fillRect((rnd() * c.width) | 0, (rnd() * c.height) | 0, 1 + ((rnd() * 3) | 0), 1 + ((rnd() * 3) | 0)); }
  const hh = Math.round(c.height * (big ? .3 : .22)); g.fillStyle = hdr; g.fillRect(0, 0, c.width, hh);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold ' + Math.max(5, Math.min(9, Math.floor((c.width - 3) / (lines[0].length * .62)))) + 'px monospace'; g.fillStyle = '#e8dcc0'; g.fillText(lines[0], c.width / 2, hh / 2 + 1);
  g.fillStyle = '#2a2018'; const rest = lines.slice(1), area = c.height - hh;
  rest.forEach((l, i) => { g.font = (big ? 'bold ' + Math.max(5, Math.min(Math.round(area * .5), Math.floor((c.width - 4) / (l.length * .62)))) : 'bold 6') + 'px monospace'; g.fillText(l, c.width / 2, hh + (i + .6) * (area / (rest.length + .3))); });
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lam(0, t)); m.material.side = THREE.DoubleSide;
  m.position.set(x, y, WZ + .12 + scene.children.length * .0004); m.rotation.z = tilt; scene.add(m); return m;
}
const FALL = [
  { mesh: makePoster(1.12, .86, .3, .38, -.09, ['DAYS SINCE', 'INCIDENT', '0'], '#2e3a3a', true), t0: 0,  xe: 1.0,  ze: -.27, ye: .011, side: 1,  spin: .5,  ph: 1 },
  { mesh: makePoster(1.3, .62, .62, .8, .02, ['STATION 9', 'NIGHT CLERK', '1 KEEP IT LEVEL', '2 LOG EVERY HOUR', '3 NO VISITORS', '4 DO NOT USE', '  THE EAST WALL'], '#7a1c1c', false), t0: 1.0, xe: 1.42, ze: -.3, ye: .006, side: -1, spin: -.35, ph: 3 }];
FALL.forEach(f => { f.x0 = f.mesh.position.x; f.y0 = f.mesh.position.y; f.z0 = f.mesh.position.z; f.tilt = f.mesh.rotation.z; });
makePoster(.72, .9, .22, .3, .05, ['NO', 'SMOKING'], '#3a3a3a', true);
makePoster(-1.78, .8, .4, .5, -.03, ['GAUGES', 'DO NOT', 'LIE'], '#4a3a2a', true);
let posterT = -1, reading = false;
const LORE = ['STATION 9    NIGHT LEDGER', '--------------------------------', 'CLERK 1    RESIGNED', ' "PRESSURE HOLDS. SOMEONE KEEPS', '  WALKING ABOVE US."', 'CLERK 2    TRANSFERRED',
  ' "ASKED WHO OPENS THE VALVES ON', '  DAYS. NOBODY KNEW."', 'CLERK 3    NO ENTRY AFTER 03:00', ' "THE EAST WALL TORE. A GAUGE.', '  NO PIPE. NOT ON THE ROSTER."',
  ' "IT CLIMBS WHEN I LOOK AWAY.', '  DO NOT LOOK AWAY."', '--------------------------------', 'CLERK 4    YOU'];                                                           // seconds since the first corner gave way
function paperRip(v){ click(3200, .3 * v, .14); click(1800, .2 * v, .2, .05); }
function paperLand(){ thunk(100, .25, 0, .12); click(900, .25, .06); }
function posterStep(dt){
  if(posterT < 0) return; posterT += dt;
  FALL.forEach((f, i) => { const m = f.mesh, t = posterT - f.t0; if(t < 0) return;
    if(t < 1.1){                                                            // a taped corner gives way and it hangs
      const k = Math.sin(Math.min(1, t / 1.1) * Math.PI * .5); if(!f.r1){ f.r1 = 1; paperRip(.5); }
      m.rotation.z = f.tilt - .16 * k * f.side + Math.sin(t * 40) * .004; m.position.y = f.y0 - .02 * k;
    } else if(t < 2.6){                                                     // then it lets go, and flutters
      const u = (t - 1.1) / 1.5, e = u * u * (.4 + .6 * u); if(!f.r2){ f.r2 = 1; paperRip(.8); if(i === 1) say('SOMETHING FELL.', 3.5); }
      m.position.set(f.x0 + (f.xe - f.x0) * u + Math.sin(u * 7 + f.ph) * .07 * (1 - u), f.y0 - .02 + (f.ye - f.y0 + .02) * e, f.z0 + (f.ze - f.z0) * u);
      m.rotation.x = -Math.PI / 2 * Math.pow(u, 1.4); m.rotation.z = f.tilt - .16 * f.side + f.spin * u + Math.sin(u * 9 + f.ph) * .25 * (1 - u);
    } else {                                                                // and lies on the desk, face up
      if(!f.done){ f.done = true; paperLand(); }
      m.position.set(f.xe, f.ye, f.ze); m.rotation.set(-Math.PI / 2, 0, f.tilt - .16 * f.side + f.spin);
    }
  });
}

function drawPlate(G, v){                              /* - [----|--o--] +   shows which way the valve is set */
  const Pl = G.plate; if(Pl.last === v) return; Pl.last = v; const g = Pl.g;
  g.fillStyle = '#1a1412'; g.fillRect(0, 0, 64, 24); g.fillStyle = '#d8c9a8'; g.font = 'bold 15px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('-', 7, 12); g.fillText('+', 57, 12);
  g.fillStyle = '#5a4a40'; g.fillRect(16, 11, 32, 2); g.fillRect(31, 7, 2, 10);
  g.fillStyle = '#d8c9a8'; g.fillRect(Math.round(32 + v * 15) - 2, 6, 4, 12); Pl.tx.needsUpdate = true;
}
function drawGauge(G, p, fourth, tremble){
  const g = G.g, rad = d => d * Math.PI / 180, ang = q => -135 + 270 * q;
  g.fillStyle = '#14100f'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = fourth ? '#cbbd9a' : '#d8c9a8'; g.beginPath(); g.arc(32, 32, 30, 0, 7); g.fill();
  g.strokeStyle = '#3a2f2a'; g.lineWidth = 1;
  for(let q = 0; q <= 10; q++){ const a = rad(ang(q / 10)); g.beginPath(); g.moveTo(32 + Math.sin(a) * 26, 32 - Math.cos(a) * 26); g.lineTo(32 + Math.sin(a) * 30, 32 - Math.cos(a) * 30); g.stroke(); }
  if(!fourth){ g.strokeStyle = '#2f6b3a'; g.lineWidth = 4; g.beginPath(); g.arc(32, 32, 22, rad(ang(.5 - D().band) - 90), rad(ang(.5 + D().band) - 90)); g.stroke(); }
  else { g.strokeStyle = '#8a1c1c'; g.lineWidth = 4; g.beginPath(); g.arc(32, 32, 22, rad(ang(.82) - 90), rad(ang(1) - 90)); g.stroke(); }
  const a = rad(ang(Math.max(0, Math.min(1, p + tremble))));
  g.strokeStyle = '#7a1414'; g.lineWidth = 2; g.beginPath(); g.moveTo(32, 32); g.lineTo(32 + Math.sin(a) * 23, 32 - Math.cos(a) * 23); g.stroke();
  g.fillStyle = '#14100f'; g.fillRect(30, 30, 4, 4);
  if(!fourth){ g.font = 'bold 11px monospace'; g.textAlign = 'center'; g.fillStyle = '#3a2f2a'; g.fillText(G.label, 32, 55); }
  G.tx.needsUpdate = true;
}

/* lights */
const amb = new THREE.AmbientLight(0x8a6a6a, .38); scene.add(amb);
const lamp = new THREE.PointLight(0xffd3a8, 1.0, 7, 1); lamp.position.set(-.15, .9, -.05); scene.add(lamp);
const redL = new THREE.PointLight(0xff2a18, 0, 6, 1); redL.position.set(0, 1.1, .4); scene.add(redL);
const waterTex = tex(32, ['#10222a', '#1b3640', '#2a4d58'], 1.8, [6, 4], (g, s) => { g.fillStyle = '#07131a'; for(let y = 3; y < s; y += 6) g.fillRect(0, y, s, 1); });
const water = new THREE.Mesh(new THREE.PlaneGeometry(9, 7), snap(new THREE.MeshLambertMaterial({ map: waterTex, transparent: true, opacity: .92, side: THREE.DoubleSide })));
water.rotation.x = -Math.PI / 2; water.position.set(.5, -.8, 1.2); water.visible = false; scene.add(water);
scene.fog = new THREE.Fog(0x050e12, 30, 40); let waterY = -.8, subV = 0;
const blue = new THREE.PointLight(0x3a5cff, 0, 5, 1.2); blue.position.set(1.3, .62, WZ + .35); scene.add(blue);

/* ---------- text under the filter ---------- */
function textBlock(g, lines, x, y, size, color, align){
  let s = size; const set = () => g.font = 'bold ' + s + 'px ui-monospace,"Courier New",monospace';
  set(); const wide = () => Math.max(...lines.map(l => g.measureText(l).width));

  const lh = Math.round(s * 1.5), w = wide(), left = Math.round(align === 'c' ? x - w / 2 : align === 'r' ? x - w : x);

function introSound(){                                                  /* unnerving ambience under the logo, then it drains away */
  if(!ac) return; const T = ac.currentTime;
  const mk = (type, f, lpF) => { const o = ac.createOscillator(), l = ac.createBiquadFilter(), g = ac.createGain(); o.type = type; o.frequency.value = f; l.type = 'lowpass'; l.frequency.value = lpF; l.Q.value = 2; o.connect(l).connect(g).connect(master); o.start(T); o.stop(T + 9); return g; };
  [55, 58.3].forEach(f => { const g = mk('sawtooth', f, 160); g.gain.setValueAtTime(0, T + .8); g.gain.linearRampToValueAtTime(.07, T + 4); g.gain.linearRampToValueAtTime(.09, T + 6); g.gain.linearRampToValueAtTime(0, T + 8.5); });
  const sw = ac.createBufferSource(); sw.buffer = noiseBuf(3, true); sw.loop = true; const bp = ac.createBiquadFilter(), sg = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = .8;
  bp.frequency.setValueAtTime(200, T + 1); bp.frequency.exponentialRampToValueAtTime(900, T + 4.9); sg.gain.setValueAtTime(0, T + 1); sg.gain.linearRampToValueAtTime(.16, T + 4.9); sg.gain.linearRampToValueAtTime(0, T + 7.1);
  sw.connect(bp).connect(sg).connect(master); sw.start(T); sw.stop(T + 8);
  click(900, .25, .05, 4.1); thunk(48, .35, 4.1, .6);                      /* something, far off, during the hold */
  thunk(70, .1, 10, .8);                                                  /* one creak in the black, barely there */
}
function winSound(){                                                    /* horn, then the pumps wind down, a door, footsteps coming, black, then three slow thuds for the card */
  if(!ac) return;
  click(1500, .5, .04, 5.5); thunk(80, .7, 5.5, .3);
  [6.4, 7.0, 7.6, 8.2].forEach((t, i) => thunk(100 - i * 4, .12 + i * .07, t, .14));
  thunk(45, .5, 15, .9); thunk(48, .5, 17.5, .8); thunk(36, .9, 20.5, 1.4); click(300, .4, .1, 20.5);
}
function floodSound(){
  if(!ac) return; const T = ac.currentTime, n = (len, brown) => { const s = ac.createBufferSource(); s.buffer = noiseBuf(len, brown); s.loop = true; return s; };
  const o = ac.createOscillator(), kl = ac.createBiquadFilter(), kg = ac.createGain(); o.type = 'square'; kl.type = 'lowpass'; kl.frequency.value = 1100;   // klaxon, two tones
  for(let k = 0; k < 28; k++) o.frequency.setValueAtTime(k % 2 ? 330 : 440, T + .6 + k * .55);
  kg.gain.setValueAtTime(0, T); kg.gain.linearRampToValueAtTime(.09, T + .7); kg.gain.setValueAtTime(.09, T + 13); kg.gain.linearRampToValueAtTime(0, T + 16);
  o.connect(kl).connect(kg).connect(master); o.start(T); o.stop(T + 17);
  const h = n(2, false), hp = ac.createBiquadFilter(), hg = ac.createGain(); hp.type = 'highpass'; hp.frequency.value = 3500;       // leak hiss
  hg.gain.setValueAtTime(0, T + 1); hg.gain.linearRampToValueAtTime(.09, T + 8); hg.gain.linearRampToValueAtTime(0, T + 16); h.connect(hp).connect(hg).connect(master); h.start(T);
  const r = n(3, true), bp = ac.createBiquadFilter(), rg = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = .7;                   // the rush, sweeping up
  bp.frequency.setValueAtTime(150, T + 2); bp.frequency.exponentialRampToValueAtTime(1400, T + 14);
  rg.gain.setValueAtTime(0, T + 2); rg.gain.linearRampToValueAtTime(.55, T + 14); rg.gain.linearRampToValueAtTime(0, T + 17); r.connect(bp).connect(rg).connect(master); r.start(T);
  [1.4, 3.6, 6.1, 8.8, 11].forEach((s, i) => {                                                                                      // pipes groaning, rivets going
    const g = ac.createOscillator(), gl = ac.createBiquadFilter(), gg = ac.createGain(); g.type = 'sawtooth'; gl.type = 'lowpass'; gl.frequency.value = 220;
    g.frequency.setValueAtTime(70 - i * 4, T + s); g.frequency.exponentialRampToValueAtTime(38, T + s + 1.1);
    gg.gain.setValueAtTime(.001, T + s); gg.gain.linearRampToValueAtTime(.22, T + s + .3); gg.gain.exponentialRampToValueAtTime(.001, T + s + 1.2);
    g.connect(gl).connect(gg).connect(master); g.start(T + s); g.stop(T + s + 1.3); thunk(60 - i * 3, .6, s); });
  for(let i = 0; i < 14; i++) click(2500, .35, .03, 2 + Math.random() * 10);
  lpM.frequency.setValueAtTime(16000, T + 11); lpM.frequency.exponentialRampToValueAtTime(260, T + 14.5);                         // the camera goes under
  master.gain.setTargetAtTime(.3, T + 16.1, .25);
  for(let i = 0; i < 6; i++){ const b = ac.createOscillator(), bg = ac.createGain(), t0 = T + 16.6 + i * .35 + Math.random() * .2; b.frequency.setValueAtTime(380 - i * 40, t0); b.frequency.exponentialRampToValueAtTime(140, t0 + .18);
    bg.gain.setValueAtTime(.12, t0); bg.gain.exponentialRampToValueAtTime(.001, t0 + .2); b.connect(bg).connect(master); b.start(t0); b.stop(t0 + .25); }
  thunk(40, .9, 21, 1.4); click(300, .5, .1, 21);                                     /* black from 16 s, text and thud at 21 s */
}
let knocked = 0;
function tickStep(dt){                                                 /* the fourth gauge ticks: faster as it climbs, slower as you watch it fall */
  if(!ac || state !== 'play' || !g4Shown || level < .05) return;
  tickAcc += dt * (2 + level * 16);
  while(tickAcc >= 1){ tickAcc -= 1; click(2000 + Math.random() * 900, .05 + level * .12, .012); }
}
function endAudio(){ if(!ac || state !== 'answered') return;
  if(endT > 2.2 && knocked < 3 && endT > 2.2 + knocked * 1.1){ master.gain.setTargetAtTime(.9, ac.currentTime, .01); thunk(70, 1, 0, .25); click(300, .6, .08); knocked++; } }

/* ---------- music: only if the player loads a track. it arrives from far above, through the earth ---------- */
let music = { name: '', buf: null, src: null, nodes: [], status: '' };
const idb = {
  open(){ return new Promise(res => { try{ const r = indexedDB.open('sump-clerk', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); },
  async run(mode, fn){ const db = await this.open(); if(!db) return null; return new Promise(res => { try{ const q = fn(db.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }catch(e){ res(null); } }); },
  get(k){ return this.run('readonly', st => st.get(k)); }, set(k, v){ return this.run('readwrite', st => st.put(v, k)); }, del(k){ return this.run('readwrite', st => st.delete(k)); }
};
const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
const decode = data => new OAC(2, 1, 44100).decodeAudioData(data);           // validates the file without needing a click-started context
idb.get('music').then(async v => { if(v && v.data){ try{ music.buf = await decode(v.data.slice(0)); music.name = v.name; hudKey = ''; }catch(e){} } });
function makeRoom(ctx, wetAmt, dryAmt){
  const input = ctx.createGain(), output = ctx.createGain(), sr = ctx.sampleRate, len = sr * 3.4 | 0;
  const d = ctx.createGain(); d.gain.value = dryAmt; input.connect(d).connect(output);
  const pre = ctx.createDelay(.2); pre.delayTime.value = .06; const ir = ctx.createBuffer(2, len, sr);
  for(let c = 0; c < 2; c++){ const a = ir.getChannelData(c); let y = 0; for(let i = 0; i < len; i++){ const k = i / len; y += (.5 - .44 * k) * ((Math.random() * 2 - 1) * Math.pow(1 - k, 2.4) - y); a[i] = y * 2.2; } }
  const conv = ctx.createConvolver(); conv.buffer = ir; const w = ctx.createGain(); w.gain.value = wetAmt; input.connect(pre).connect(conv).connect(w).connect(output);
  return { input, output };
}
function startMusic(){
  if(!ac || !music.buf || music.src) return;
  const src = ac.createBufferSource(); src.buffer = music.buf; src.loop = true;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = .5;                          // concrete and earth between you and it
  const l1 = ac.createOscillator(), g1 = ac.createGain(); l1.frequency.value = .045; g1.gain.value = 240; l1.connect(g1).connect(lp.frequency); l1.start();   // it breathes
  const l2 = ac.createOscillator(), g2 = ac.createGain(); l2.frequency.value = .07; g2.gain.value = 14; l2.connect(g2).connect(src.detune); l2.start();         // slow pitch sag, like a far-off speaker
  const room = makeRoom(ac, .95, .3), out = ac.createGain(); out.gain.value = .26;
  const l3 = ac.createOscillator(), g3 = ac.createGain(); l3.frequency.value = .031; g3.gain.value = .07; l3.connect(g3).connect(out.gain); l3.start();           // faint dropouts
  src.connect(hp).connect(lp).connect(room.input); room.output.connect(out).connect(musicBus);
  src.start(); music.src = src; music.nodes = [l1, l2, l3];
}
function stopMusic(){ if(!music.src) return; try{ music.src.stop(); music.nodes.forEach(o => o.stop()); }catch(e){} music.src = null; music.nodes = []; }
const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = 'audio/*'; fileIn.style.display = 'none'; document.body.appendChild(fileIn);
fileIn.addEventListener('change', async () => {
  const f = fileIn.files[0]; fileIn.value = ''; if(!f) return;
  if(f.size > 80e6){ music.status = 'THAT FILE IS TOO LARGE (80 MB MAX).'; hudKey = ''; return; }
  try{ const data = await f.arrayBuffer(); music.buf = await decode(data.slice(0)); music.name = f.name; music.status = 'LOADED. IT IS VERY FAR AWAY.'; await idb.set('music', { name: f.name, data }); stopMusic(); startMusic(); }
  catch(e){ music.status = 'COULD NOT READ THAT FILE.'; }
  hudKey = '';
});
function removeMusic(){ music.buf = null; music.name = ''; music.status = 'REMOVED. SILENCE.'; stopMusic(); idb.del('music'); hudKey = ''; }

/* ---------- input ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let mx = .5, dragging = -1, lastX = 0;
const cv = renderer.domElement;
cv.addEventListener('pointermove', e => {
  mx = e.clientX / innerWidth;
  if(dragging >= 0 && state === 'play'){
    const dx = e.clientX - lastX; lastX = e.clientX; const old = V[dragging];
    V[dragging] = Math.max(-1, Math.min(1, V[dragging] + dx / 180));
    if(Math.floor(V[dragging] * 8) !== Math.floor(old * 8)) click(1100, .18, .02);
  }
});
cv.addEventListener('pointerdown', e => {
  lastX = e.clientX;
  if(state === 'gate'){ startAudio(); introSound(); state = 'logo'; introT = 0; hudKey = ''; return; }
  if(state === 'logo' || state === 'black') return;
  if(state === 'settings') return;
  if(state === 'title'){ if(e.clientY / innerHeight > .935) return; startAudio(); begin(); return; }
  if(state === 'win' || state === 'flood' || state === 'answered'){ if(endT > (state === 'flood' ? 24 : state === 'win' ? 25 : 2.5)) location.reload(); return; }
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, cam);
  if(reading){ reading = false; hudKey = ''; return; }
  const hit = ray.intersectObjects([...gauges.map(G => G.pick), ledger], false)[0];
  if(hit && hit.object === ledger){ reading = true; hudKey = ''; paperRip(.3); return; }
  if(hit){ dragging = hit.object.userData.i; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('click', e => {                                   // settings pane: clicks resolved by row, in screen fractions
  const fy = e.clientY / innerHeight, fx = e.clientX / innerWidth;
  if(state === 'title' && fy > .935){ state = 'settings'; hudKey = ''; return; }
  if(state !== 'settings') return;
  if(fy > .935) { state = 'title'; hudKey = ''; }
  else if(fy > .12 && fy < .35) setDiff(fx < .4 ? -1 : 1);
  else if(fy >= .35 && fy < .57) setLen(fx < .4 ? -1 : 1);
  else if(fy > .7 && fy < .77) fileIn.click();
  else if(fy >= .77 && fy < .82 && music.name) removeMusic();
});
addEventListener('keydown', e => {
  if(reading && (e.code === 'Escape' || e.code === 'Space' || e.code === 'KeyE')){ reading = false; hudKey = ''; }
  else if(state === 'title' && e.code === 'KeyS'){ state = 'settings'; hudKey = ''; }
  else if(state === 'settings'){ if(e.code === 'Escape'){ state = 'title'; hudKey = ''; } if(e.code === 'ArrowLeft') setDiff(-1); if(e.code === 'ArrowRight') setDiff(1); if(e.code === 'ArrowUp') setLen(-1); if(e.code === 'ArrowDown') setLen(1); }
});
addEventListener('pointerup', () => { dragging = -1; cv.classList.remove('drag'); });
function begin(){ state = 'play'; t = 0; blackout(1.2); say('', 0); if(!MUTE && ac) { /* quiet start: room fades in */ master.gain.value = 0; masterTo(.85, 1.2); } }

/* ---------- camera + loop ---------- */
let pan = .5, prev = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - prev) / 1000); prev = now; const tt = now / 1000;
  const pt = Math.max(0, Math.min(1, (mx - .15) / .7)); pan += (pt - pan) * Math.min(1, dt * 3);
  watched = pan > .8 && g4Shown;                       // cursor well to the right: the camera is on the fourth gauge
  update(dt); posterStep(dt); const lm = lights(dt); audioFrame(lm); tickStep(dt); endAudio();
  gauges.forEach((G, i) => { drawGauge(G, P[i], false, 0); if(G.wheel){ G.wheel.rotation.z = -V[i] * Math.PI * 1.6; drawPlate(G, V[i]); } });
  if(g4Shown) drawGauge(g4, level, true, level > .6 ? Math.sin(tt * 40) * .012 * level : 0);
  const b = Math.sin(2 * Math.PI * tt / 6.2) + .3 * Math.sin(2 * Math.PI * tt / 3.1 + .8);
  const cx = pan < .5 ? -.35 - .3 * (.5 - pan) * 2 : -.35 + 1.25 * (pan - .5) * 2;   // centred cursor = the three pumps centred
  let shx = 0, shy = 0, shr = 0;
  if(state === 'flood'){ const k = Math.min(1, endT / 8) * (endT > 16 ? 0 : 1); shx = (Math.sin(tt * 37) * .012 + Math.sin(tt * 53) * .006) * k; shy = Math.sin(tt * 41) * .01 * k; shr = Math.sin(tt * 23) * .025 * k + Math.sin(tt * .9) * .05 * k * k; }
  let pullY = 0, pullZ = 0; if(state === 'win'){ const k = Math.min(1, endT / 9), e = k * k * (3 - 2 * k); pullY = .12 * e; pullZ = .55 * e; }   /* standing up, stepping back */
  cam.position.set(cx + shx, .52 + b * .006 + shy + pullY, 1.55 + b * .005 + pullZ); cam.lookAt(cx * .85, .4 + b * .003, WZ); cam.rotateZ(Math.sin(2 * Math.PI * tt / 17) * .014 + Math.sin(2 * Math.PI * tt / 9.3 + 1.2) * .004 + shr);
  postMat.uniforms.time.value = tt; postMat.uniforms.ca.value = subV * 1.8 + (state === 'flood' ? Math.min(1, endT / 10) * .4 : 0); postMat.uniforms.vigK.value = 1.35 + subV * .6 + (state === 'flood' ? Math.min(1, endT / 10) * .15 : 0); postMat.uniforms.blk.value = (state === 'gate' || state === 'logo' || state === 'black' || (state === 'flood' && endT > 16) || (state === 'win' && endT > 10.5)) ? 1 : 0;
  drawHUD();
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(post, postCam);
}
resize(); requestAnimationFrame(frame);
if(AUTO) begin();
if(Q.has('debug') || MUTE) window.__sump = { P, V, get state(){ return state; }, get level(){ return level; }, get progress(){ return progress; }, skip(p){ t = p * SHIFT(); }, flood(){ if(state === 'play'){ strikes = D().strikes - 1; trip(0); } }, get endT(){ return endT; }, get introT(){ return introT; }, endTo(v){ endT = v; }, introTo(v){ introT = v; } };   // test hooks
</script>
