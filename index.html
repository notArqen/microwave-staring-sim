<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microwave Staring Sim</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:default; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const QUIET = /[?&]quiet/.test(location.search);   // dev: no audio, auto-start
if(QUIET){ window.AudioContext=undefined; window.webkitAudioContext=undefined; }

/* ---------- renderer: tiny render target, chunky post pass ---------- */
const RTH = 300;
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(1);
document.body.prepend(renderer.domElement);

const snapRes = { value:new THREE.Vector2(160,120) };
const rt = new THREE.WebGLRenderTarget(320, RTH, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });

const post = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat = new THREE.ShaderMaterial({
  uniforms:{ t:{value:rt.texture}, res:{value:new THREE.Vector2(320,RTH)}, time:{value:0}, boost:{value:1.9},
    hud:{value:null}, menu:{value:null}, mA:{value:1}, blk:{value:1} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    precision highp float;
    uniform sampler2D t; uniform sampler2D hud; uniform sampler2D menu;
    uniform vec2 res; uniform float time; uniform float boost; uniform float mA; uniform float blk;
    varying vec2 vUv;
    float b2(vec2 a){ a=floor(a); return fract(a.x/2.+a.y*a.y*.75); }
    float b4(vec2 a){ return b2(.5*a)*.25+b2(a); }
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    vec3 pal(float i){
      if(i<.5) return vec3(.05,.025,.04);
      if(i<1.5) return vec3(.19,.08,.10);
      if(i<2.5) return vec3(.35,.28,.25);
      if(i<3.5) return vec3(.55,.38,.38);
      if(i<4.5) return vec3(.71,.57,.50);
      return vec3(.86,.76,.64);
    }
    void main(){
      vec2 px = floor(vUv*res);
      vec2 uv = (px+.5)/res;
      vec3 c = texture2D(t,uv).rgb * boost;
      /* text and menu live in the same low-res pipeline, so they get the same dither + palette */
      vec4 hu = texture2D(hud,uv); c = mix(c, hu.rgb, hu.a);
      if(blk>.5) c = vec3(0.);
      vec4 mn = texture2D(menu,uv);
      float show = (mA > .001 && mA > h(floor(px*.5)*2.+3.)) ? 1. : 0.;
      c = mix(c, mn.rgb, mn.a*show);
      float l = dot(c, vec3(.3,.59,.11));
      l = pow(l, .72);
      float d = (b4(px)-.47)*.2;
      float idx = clamp(floor((l+d)*6.+.5), 0., 5.);
      vec3 p = pal(idx);
      vec3 tint = clamp(c/(l+.03), .45, 2.2);
      vec3 o = mix(p, p*tint, .5);
      /* party blue: blue-dominant pixels skip the mauve palette and get three hard, vivid blue steps */
      float bl = c.b - max(c.r, c.g)*1.15 + d*.7;                       // dither on the edge so it feathers into grain
      if(bl > .16){
        float grit = h(px) - .5;                                        // dirty speckle in the band edges
        float q = floor(clamp((bl-.16)*1.2 + grit*.28, 0., .999)*3.)/2.;
        vec3 blue = q<.25 ? vec3(.012,.02,.13) : q<.75 ? vec3(.045,.085,.34) : vec3(.10,.17,.50);   // three hard, dark, grimy steps
        blue += vec3(.02,.03,.0)*(h(px+7.)-.3);                          // murk
        o = mix(o, blue, clamp((bl-.16)*2.4, 0., 1.));
      }
      /* second posterize pass, per channel */
      o = floor(o*7.+.5)/7.;
      /* grain + vignette */
      float g = h(px+floor(time*12.))-.5;
      o += g*.045;
      vec2 q = vUv-.5;
      o *= 1.-dot(q,q)*1.35;
      gl_FragColor = vec4(o,1.);
    }`
});
post.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));

/* ---------- low-res text layers (hud + menu) ---------- */
const mkLayer = () => { const c=document.createElement('canvas'); const tx=new THREE.CanvasTexture(c);
  tx.minFilter=tx.magFilter=THREE.NearestFilter; tx.generateMipmaps=false; return {c, g:c.getContext('2d'), tx}; };
const hudL = mkLayer(), menuL = mkLayer();
postMat.uniforms.hud.value = hudL.tx; postMat.uniforms.menu.value = menuL.tx;
const ui = { prompt:'', stat:'', msg:'', board:null, toast:'' };
const FONT = 'ui-monospace,"Courier New",monospace';

/* draws a block of lines on a dark plate; shrinks the font until it fits */
function textBlock(g, lines, x, y, size, color, align, rw, plate=true){
  let s = size, widest = 0;
  const setF = () => { g.font = `bold ${s}px ${FONT}`; try{ g.letterSpacing = Math.max(0,Math.round(s/8))+'px'; }catch(e){} };
  setF(); const meas = () => Math.max(...lines.map(l=>g.measureText(l).width));
  widest = meas();
  while(widest > rw-10 && s>5){ s--; setF(); widest = meas(); }
  const lh = Math.round(s*1.5), hgt = lines.length*lh, pad = 3;
  let left = align==='center' ? x-widest/2 : align==='right' ? x-widest : x;
  left = Math.round(left); y = Math.round(y);
  if(plate){ g.fillStyle='rgba(0,0,0,.72)'; g.fillRect(left-pad, y-pad, widest+pad*2, hgt+pad*2-(lh-s)); }
  g.textBaseline='top'; g.textAlign='left';
  lines.forEach((l,i)=>{
    const ly = y + i*lh, lx = align==='center' ? Math.round(x - g.measureText(l).width/2) : left;
    g.fillStyle='#000'; g.fillText(l,lx+1,ly+1);
    g.fillStyle=color; g.fillText(l,lx,ly);
  });
  return s;
}
let fl=1, flickTarget=1, flickNext=0;

/* ---------- state shared by menu, hud and game (declared early: the menu draws from it) ---------- */
const COLS = [
  {n:'RED',    hex:0xd8453a, css:'#ff7a68'},
  {n:'BLUE',   hex:0x3a82e0, css:'#78b0ff'},
  {n:'YELLOW', hex:0xe0c43a, css:'#ffe45a'},
  {n:'GREEN',  hex:0x4fc45a, css:'#78ff88'},
];
let mp = null;                        // null = solo, otherwise { n, me } for an online match
let menuView = 'main', joinCode = '', menuHover = -1, netStatus = '';
const net = { role:null, peer:null, conns:[], hostConn:null, pid:null, code:'', players:[], lobby:[], order:[],
  round:0, rounds:5, resolved:{}, rpts:{}, tot:{}, started:false, dead:false, roundTimer:null, nextId:0 };
const MENU_ITEMS = [['p','SOLO'],['h','HOST A ROOM'],['j','JOIN A ROOM'],['i','HOW TO PLAY'],['s','SETTINGS']];
const menuRowY = i => RTH*.46 + i*19;
const menuRowAt = y => { const i = Math.round((y-RTH*.46)/19); return (i>=0 && i<MENU_ITEMS.length && Math.abs(y-menuRowY(i))<10) ? i : -1; };
/* settings screen: the player's own music, kept in this browser only */
let musicMode = (()=>{ try{ return localStorage.getItem('mw-music-mode')==='legacy' ? 'legacy' : 'new'; }catch(e){ return 'new'; } })();   // which built-in synth
let randomTime = (()=>{ try{ return localStorage.getItem('mw-random-time')!=='off'; }catch(e){ return true; } })();   // solo: random 15s-3min unless switched off
let customInfo = null, settingsMsg = '';              // customInfo: { name, bpm } once a track is saved
const SETTINGS_ROWS = [['u',.34],['c',.43],['l',.52],['t',.61],['escape',.91]];
const settingsRowAt = y => { for(const [k,f] of SETTINGS_ROWS) if(Math.abs(y-RTH*f)<10) return k; return null; };

/* scoring: seconds away from the end -> points, linear between anchors. letting it end costs points. */
const POINTS_CURVE = [[0,15],[.002,15],[.004,14],[.5,13],[10,3],[14,1],[20,0]];   // +15 only within the last 2ms
const END_PENALTY = -5;
function pointsFor(rem){
  const c = POINTS_CURVE;
  if(rem <= c[0][0]) return c[0][1];
  for(let i=1;i<c.length;i++) if(rem <= c[i][0]){
    const [x0,y0]=c[i-1], [x1,y1]=c[i];
    return Math.round(y0 + (y1-y0)*(rem-x0)/(x1-x0));
  }
  return 0;
}
function helpLines(){
  const row = (label,v) => label.padEnd(26) + ((v>0?'+':'')+v).padStart(4);
  return ['HOW TO PLAY','',
    'A MICROWAVE COUNTS DOWN.','OPEN THE DOOR [E / SPACE / CLICK]','AS LATE AS YOU DARE.','',
    row('LAST 0.002 SECONDS',pointsFor(0)), row('0.5 SECONDS AWAY',pointsFor(.5)), row('10 SECONDS AWAY',pointsFor(10)),
    row('14 SECONDS AWAY',pointsFor(14)), row('20+ SECONDS AWAY',pointsFor(20)), row('LET IT END',END_PENALTY),'',
    'ONLINE: 2-4 PLAYERS, 5 ROUNDS.','EVERYONE HAS A MICROWAVE AND A','DIFFERENT TIMER. YOURS HAS THE','GREEN SCREEN. MOST POINTS WINS.','','[ESC] BACK'];
}

/* menu: slow dust, a scan band, a flickering title and a far-off green display */
const dust = Array.from({length:44},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0016,vy:-.0008-Math.random()*.0022,p:Math.random()*6}));
let glitch = 0;
function drawMenu(rw, t){
  const g = menuL.g;
  g.fillStyle='#050403'; g.fillRect(0,0,rw,RTH);
  const fk = fl;
  const gr = g.createRadialGradient(rw/2,RTH*.96,4,rw/2,RTH*.96,RTH*.75);
  gr.addColorStop(0,`rgba(46,120,44,${.13+.07*fk})`); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,rw,RTH);
  dust.forEach(d=>{
    d.x += d.vx + Math.sin(t*.4+d.p)*.0006; d.y += d.vy;
    if(d.y<0){ d.y=1; d.x=Math.random(); } if(d.x<0) d.x=1; if(d.x>1) d.x=0;
    g.fillStyle=`rgba(200,175,130,${.2+.25*Math.sin(t*1.3+d.p)})`;
    g.fillRect((d.x*rw)|0,(d.y*RTH)|0,1,1);
  });
  const by = ((t*16)%(RTH+60))-30; g.fillStyle='rgba(130,115,80,.07)'; g.fillRect(0,by,rw,12);
  if(glitch>0) glitch--; else if(Math.random()<.012) glitch=3+((Math.random()*4)|0);
  const jx = glitch>0 ? (Math.random()<.5?-2:2) : 0;
  const b = .55+.45*fk, cx = rw/2, green = `rgb(${107*b|0},${255*b|0},${90*b|0})`, main = menuView==='main';
  textBlock(g,['MICROWAVE'], cx+jx, main?RTH*.18:RTH*.05, main?26:14, green, 'center', rw, false);
  textBlock(g,['STARING SIM'], cx, main?RTH*.18+40:RTH*.05+20, main?10:7, green, 'center', rw, false);
  if(main){
    MENU_ITEMS.forEach(([k,label],i)=>{
      const p = menuHover===i ? 1 : .55+.2*Math.sin(t*2.2+i*.8);
      textBlock(g,[`[${k.toUpperCase()}] ${label}`], cx, menuRowY(i), 12, `rgb(${255*p|0},${225*p|0},${74*p|0})`, 'center', rw, false);
    });
    if(netStatus) textBlock(g,[netStatus], cx, RTH*.72, 8, '#e0603a', 'center', rw, false);
    textBlock(g,['1'+(Math.floor(t)%2===0?':':' ')+'47'], cx, RTH*.80, 9, '#3f8f3a', 'center', rw, false);
    textBlock(g,['HEADPHONES RECOMMENDED'], cx, RTH*.91, 6, '#6a5a40', 'center', rw, false);
  } else if(menuView==='help'){
    textBlock(g, helpLines(), cx, RTH*.16, 8, '#cdb98a', 'center', rw, false);
  } else if(menuView==='settings'){
    const cur = customInfo ? `${customInfo.name.length>26 ? customInfo.name.slice(0,25)+'~' : customInfo.name}  (${customInfo.bpm} BPM)` : 'BUILT-IN TRACK';
    textBlock(g,['MUSIC'], cx, RTH*.19, 9, '#a08a60', 'center', rw, false);
    textBlock(g,[cur.toUpperCase()], cx, RTH*.25, 9, '#cdb98a', 'center', rw, false);
    textBlock(g,['[U] LOAD YOUR OWN TRACK'], cx, RTH*.34, 10, '#ffe14a', 'center', rw, false);
    textBlock(g,[customInfo ? '[C] BACK TO THE BUILT-IN TRACK' : ' '], cx, RTH*.43, 10, '#ffe14a', 'center', rw, false);
    textBlock(g,[`[L] BUILT-IN SYNTH: ${musicMode==='legacy' ? 'LEGACY' : 'NEW'}`], cx, RTH*.52, 10, '#ffe14a', 'center', rw, false);
    textBlock(g,[`[T] SOLO TIMER: ${randomTime ? 'RANDOM 0:15-3:00' : 'YOUR CHOICE'}`], cx, RTH*.61, 10, '#ffe14a', 'center', rw, false);
    textBlock(g,[settingsMsg||' '], cx, RTH*.69, 9, /COULD NOT|TOO BIG/.test(settingsMsg) ? '#e0603a' : '#78ff88', 'center', rw, false);
    textBlock(g,['MP3 / WAV / OGG / M4A, 40 MB MAX.','STAYS IN THIS BROWSER. NOTHING IS UPLOADED.','THE LIGHTS LOCK TO ITS TEMPO.'], cx, RTH*.77, 7, '#6a5a40', 'center', rw, false);
    textBlock(g,['[ESC] BACK'], cx, RTH*.91, 8, '#a08a60', 'center', rw, false);
  } else if(menuView==='join'){
    textBlock(g,['ENTER ROOM CODE'], cx, RTH*.28, 11, '#cdb98a', 'center', rw, false);
    textBlock(g,[(joinCode+'____').slice(0,4).split('').join(' ')], cx, RTH*.40, 24, '#ffe14a', 'center', rw, false);
    textBlock(g,[netStatus||' '], cx, RTH*.60, 9, '#e0603a', 'center', rw, false);
    textBlock(g,['[ENTER] JOIN   [ESC] BACK'], cx, RTH*.80, 8, '#a08a60', 'center', rw, false);
  } else if(menuView==='lobby'){
    const host = net.role==='host', pids = host ? net.players.map(p=>p.pid) : net.lobby;
    textBlock(g,['ROOM CODE'], cx, RTH*.22, 9, '#a08a60', 'center', rw, false);
    textBlock(g,[net.code ? net.code.split('').join(' ') : '. . . .'], cx, RTH*.29, 26, '#ffe14a', 'center', rw, false);
    pids.forEach((pid,i)=> textBlock(g,[`${i+1}  ${COLS[i].n}${pid===net.pid?'  (YOU)':''}`], cx, RTH*.50+i*16, 10, COLS[i].css, 'center', rw, false));
    const line = netStatus || (host ? (pids.length>=2 ? '[ENTER] START THE MATCH' : 'WAITING FOR 1-3 MORE PLAYERS...') : 'WAITING FOR THE HOST...');
    textBlock(g,[line], cx, RTH*.80, 8, '#cdb98a', 'center', rw, false);
    textBlock(g,['[ESC] LEAVE'], cx, RTH*.89, 7, '#6a5a40', 'center', rw, false);
  }
  menuL.tx.needsUpdate = true;
}
let hudKey = '';
function drawHud(rw){
  const key = [rw, live, state, ui.msg, ui.stat, ui.prompt, ui.toast, net.dead, ui.board ? JSON.stringify(ui.board) : ''].join('|');
  if(key===hudKey) return; hudKey = key;
  const g = hudL.g; g.clearRect(0,0,rw,RTH);
  if(live){
    if(ui.board){
      const b = ui.board, rows = b.rows.slice();
      if(b.final) rows.sort((x,y)=>y.tot-x.tot);
      textBlock(g,[b.final ? 'FINAL SCORES' : `ROUND ${b.round} OF ${b.rounds}`], rw/2, 12, 12, '#e6d6a6', 'center', rw);
      rows.forEach((r,k)=>{
        const pts = (r.pts>0?'+':'')+r.pts;
        textBlock(g,[`${r.name.padEnd(6)} ${pts.padStart(4)}   TOTAL ${String(r.tot).padStart(3)}${r.me?'  <-- YOU':'         '}`], rw/2, 42+k*17, 9, COLS[r.i].css, 'center', rw);
      });
      if(b.final){
        const top = Math.max(...rows.map(r=>r.tot)), w = rows.filter(r=>r.tot===top).map(r=>r.name).join(' & ');
        textBlock(g,[`WINNER: ${w}`,'[ENTER] BACK TO MENU'], rw/2, RTH-52, 11, '#ffe14a', 'center', rw);
      } else textBlock(g,['NEXT ROUND SOON...'], rw/2, RTH-30, 8, '#bfae82', 'center', rw);
    } else {
      if(state==='result' && ui.msg) textBlock(g, ui.msg.split('\n'), rw/2, RTH*.64, 11, '#e6d6a6', 'center', rw);
      if(state==='result' && !mp) textBlock(g, ui.stat.split('\n'), rw-8, 8, 7, '#bfae82', 'right', rw);
      if(ui.prompt && (state==='idle' || state==='result')){ const pl = ui.prompt.split('\n'); textBlock(g, pl, rw/2, RTH-14-pl.length*12, 8, '#ffe14a', 'center', rw); }
    }
    if(ui.toast) textBlock(g,[ui.toast], rw/2, RTH*.46, 9, '#ff8a6a', 'center', rw);
    if(net.dead) textBlock(g,['THE HOST LEFT.','[ENTER] BACK TO MENU'], rw/2, RTH*.4, 12, '#ff8a6a', 'center', rw);
  }
  hudL.tx.dispose(); hudL.tx.needsUpdate = true;
}

function resize(){
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h, false);
  const rw = Math.min(900, Math.max(160, Math.round(RTH * w / h)));
  hudL.c.width = menuL.c.width = rw; hudL.c.height = menuL.c.height = RTH;
  hudKey = ''; menuL.tx.dispose(); drawMenu(rw, 0);
  rt.setSize(rw, RTH);
  postMat.uniforms.res.value.set(rw, RTH);
  snapRes.value.set(rw/2, RTH/2);
  cam.aspect = w/h;
  cam.fov = cam.aspect < 1.4 ? 2*Math.atan(Math.tan(20*Math.PI/180)*1.4/cam.aspect)*180/Math.PI : 40;
  cam.updateProjectionMatrix();
}

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
scene.fog = new THREE.Fog(0x050403, 2.2, 6);
const cam = new THREE.PerspectiveCamera(52, 1.33, .05, 20);

function patch(m){
  m.onBeforeCompile = s => {
    s.uniforms.uSnap = snapRes;
    s.vertexShader = 'uniform vec2 uSnap;\n' + s.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n gl_Position.xy = floor(gl_Position.xy/gl_Position.w*uSnap+.5)/uSnap*gl_Position.w;');
  };
  return m;
}
const lam = (c,o={}) => patch(new THREE.MeshLambertMaterial(Object.assign({color:c, flatShading:true}, o)));
const bas = (c,o={}) => patch(new THREE.MeshBasicMaterial(Object.assign({color:c}, o)));
/* textured boxes repeat at a fixed world size (mat.userData.tile metres per repeat) instead of stretching to each face */
function tileUV(geo,w,h,d,tile){
  const uv=geo.attributes.uv, dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];   // px nx py ny pz nz
  for(let f=0;f<6;f++) for(let v=0;v<4;v++){ const i=f*4+v; uv.setXY(i, uv.getX(i)*dims[f][0]/tile, uv.getY(i)*dims[f][1]/tile); }
  uv.needsUpdate=true;
}
function box(w,h,d,mat,x,y,z,parent=scene){
  const geo = new THREE.BoxGeometry(w,h,d);
  if(mat.userData && mat.userData.tile) tileUV(geo,w,h,d,mat.userData.tile);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z); parent.add(m); return m;
}

const ambient = new THREE.AmbientLight(0x4a3a36, .38);
const lamp = new THREE.PointLight(0xffd9c4, 1.0, 6); lamp.position.set(-0.5,2.3,0.6);
const moon = new THREE.DirectionalLight(0x8fa08a, .3); moon.position.set(3,2,1);
const dispLight = new THREE.PointLight(0x66ff66, .5, 1.3); dispLight.position.set(.17,1.15,.35);   // lives on your own microwave
scene.add(ambient, lamp, moon);

/* tiny procedural textures, nearest-filtered so they stay chunky under the pixel pass */
function pixTex(size, repX, repY, paint){
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  paint(g, size, rnd);
  const t=new THREE.CanvasTexture(c); t.magFilter=t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repX,repY); return t;
}
const speck=(g,n,rnd,cols,s,sz=1)=>{ for(let i=0;i<n;i++){ g.fillStyle=cols[(rnd()*cols.length)|0]; g.fillRect((rnd()*s)|0,(rnd()*s)|0,sz,sz); } };
/* blotchy multi-scale noise, the base of the grimy look */
const mottle=(s,rnd,scales)=>{ const f=new Float32Array(s*s); let tot=0;
  scales.forEach((k,oi)=>{ const w=1/(oi+1); tot+=w; const L=[]; for(let i=0;i<k*k;i++) L.push(rnd());
    for(let y=0;y<s;y++) for(let x=0;x<s;x++){
      const fx=x/s*k, fy=y/s*k, x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      const a=L[(y0%k)*k+(x0%k)], b=L[(y0%k)*k+((x0+1)%k)], c=L[((y0+1)%k)*k+(x0%k)], d=L[((y0+1)%k)*k+((x0+1)%k)];
      const top=a+(b-a)*sx, bot=c+(d-c)*sx; f[y*s+x]+=w*(top+(bot-top)*sy);
    } });
  for(let i=0;i<f.length;i++) f[i]/=tot; return f; };
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
/* paint a field through a hard-stepped colour ramp (the camo look) */
function ramp(g,s,f,cols,shift=()=>0,contrast=2.2){
  const img=g.createImageData(s,s), rc=cols.map(hex);
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    let v=(f[y*s+x]-.5)*contrast+.5+shift(x,y); v=Math.max(0,Math.min(.999,v));

let ac=null, hum=null, humGain=null, drone=null;
function audioInit(){
  if(ac) return;
  try {
    ac = new (window.AudioContext||window.webkitAudioContext)();
    preloadSfx();
    hum = ac.createOscillator(); hum.type='sawtooth'; hum.frequency.value=120;
    const hl = ac.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value=380;
    humGain = ac.createGain(); humGain.gain.value=0; hum.connect(hl).connect(humGain).connect(ac.destination); hum.start();
  } catch(e){ ac=null; }
}
/* loads sfx/<name>.(mp3|ogg|wav) and loops it; resolves false if no file exists */
async function loadLoop(name, vol){
  for(const ext of ['mp3','ogg','wav']){
    try {
      const r = await fetch(`sfx/${name}.${ext}`); if(!r.ok) continue;
      const buf = await ac.decodeAudioData(await r.arrayBuffer());
      const s = ac.createBufferSource(); s.buffer=buf; s.loop=true;
      const g = ac.createGain(); g.gain.value=vol; s.connect(g).connect(ac.destination); s.start();
      return true;
    } catch(e){}
  }
  return false;
}
/* menu ambience: low sub drone plus muffled noise. starts as soon as audio is allowed, fades out on PLAY */
let menuAmb=null;
function menuAmbStart(){
  if(!ac || menuAmb || phase!=='menu' || ac.state!=='running') return;
  const out=ac.createGain(); out.gain.value=0; out.gain.linearRampToValueAtTime(1,ac.currentTime+2.5); out.connect(ac.destination);
  const o=ac.createOscillator(); o.type='sine'; o.frequency.value=46;
  const og=ac.createGain(); og.gain.value=.16; o.connect(og).connect(out); o.start();
  const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.11; lg.gain.value=.07; lfo.connect(lg).connect(og.gain); lfo.start();
  const len=ac.sampleRate*3, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; d[i]=last*3.5; }
  const n=ac.createBufferSource(); n.buffer=buf; n.loop=true;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
  const ng=ac.createGain(); ng.gain.value=.5; n.connect(lp).connect(ng).connect(out); n.start();
  menuAmb={out,nodes:[o,lfo,n]};
}
function menuAmbStop(){
  if(!menuAmb) return;
  const m=menuAmb; menuAmb=null; m.out.gain.cancelScheduledValues(ac.currentTime);
  m.out.gain.setValueAtTime(m.out.gain.value, ac.currentTime); m.out.gain.linearRampToValueAtTime(0, ac.currentTime+.9);
  setTimeout(()=>m.nodes.forEach(x=>{ try{x.stop();}catch(e){} }), 1100);
}

const sfxBuf = {};

    await Promise.all(Object.entries(man).map(async ([name,file])=>{
      try { sfxBuf[name] = await ac.decodeAudioData(await (await fetch('sfx/'+file)).arrayBuffer()); } catch(e){}
    }));
  } catch(e){}
}
function sfx(name, vol=1, fallback){
  if(ac && sfxBuf[name]){
    const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=sfxBuf[name]; g.gain.value=vol;
    s.connect(g).connect(ac.destination); s.start(); return true;
  }
  if(fallback) fallback(); return false;
}
function loopStart(name, vol=1){
  if(!ac || !sfxBuf[name]) return null;
  const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=sfxBuf[name]; s.loop=true; g.gain.value=vol;
  s.connect(g).connect(ac.destination); s.start(); return {s,g};

   copies that each fade in and out, so it runs as long as the cook does. */

  const master=ac.createGain(); master.gain.value=.8; master.connect(ac.destination);
  const copy=(offset,len,at,fadeIn)=>{
    const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b;
    g.gain.setValueAtTime(fadeIn?0:1,at); if(fadeIn) g.gain.linearRampToValueAtTime(1,at+xf);
    g.gain.setValueAtTime(1,at+len-xf); g.gain.linearRampToValueAtTime(0,at+len);
    s.connect(g).connect(master); s.start(at,offset,len);
  };
  copy(0,L,t0,false);
  humRun={master, next:t0+L-xf};
  humRun.timer=setInterval(()=>{
    while(humRun && humRun.next < ac.currentTime+.6){ copy(L-seg,seg,humRun.next,true); humRun.next += seg-xf; }

}
function humStop(){

}
function cookStart(){ if(!humStart()) hum_synth=true; turntable=loopStart('mw_turntable',.5); }

function beep(f=2300,dur=.16,vol=.12){

  g.gain.setValueAtTime(vol,ac.currentTime); g.gain.setValueAtTime(0,ac.currentTime+dur);

/* door sounds: a latch click, a plastic clack, a hinge creak and the thunk against the stop */
let noiseBuf=null;
function noiseBurst(t, len, type, freq, q, vol, sweepTo){
  if(!ac) return; if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const n=ac.createBufferSource(); n.buffer=noiseBuf; const f=ac.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
  if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+len);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.002); g.gain.exponentialRampToValueAtTime(.0005,t+len);
  n.connect(f).connect(g).connect(ac.destination); n.start(t,Math.random()*.5); n.stop(t+len+.02);
}
function tone(t, f0, f1, len, vol, type='triangle'){
  if(!ac) return; const o=ac.createOscillator(), g=ac.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+len);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+len); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+len+.02);
}
function doorOpenSynth(vol=1){
  if(!ac) return; const t=ac.currentTime;
  noiseBurst(t,        .02,  'bandpass', 3000, .9,  1.0*vol);              // latch release: the click
  tone(t+.004,         1100, 380, .035, .32*vol, 'square');                  // plastic clack
  noiseBurst(t+.03,    .16,  'bandpass', 700,  5,   .3*vol, 1300);        // hinge creak, rising
  tone(t+.03,          240,  340, .16, .12*vol, 'sawtooth');
  noiseBurst(t+.17,    .05,  'lowpass',  500,  .7,  .5*vol);               // door meets the stop
  tone(t+.17,          120,  50,  .12, .5*vol, 'sine');                     // ...with a thunk
}
function doorCloseSynth(vol=1){
  if(!ac) return; const t=ac.currentTime;
  noiseBurst(t,        .05,  'lowpass',  600,  .7,  .5*vol);               // door swings shut
  tone(t,              130,  50,  .13, .55*vol, 'sine');
  noiseBurst(t+.05,    .014, 'bandpass', 2600, 1.6, .5*vol);               // latch catches
  tone(t+.052,         900,  300, .03, .2*vol, 'square');
}

/* menu start sound: sub drop + rising noise + thunk, rendered by hand then bitcrushed
   (sample-and-hold at ~1/8 the rate, 4-bit levels) so it sounds like a dying console */
function menuSfx(){
  if(!ac) return;
  const sr=ac.sampleRate, len=Math.floor(sr*1.3), buf=ac.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const HOLD=8, LEVELS=8;
  let ph=0, ph2=0, hold=0, nz=0;
  for(let i=0;i<len;i++){
    const t=i/sr;
    const f=160*Math.pow(34/160, Math.min(1,t/.9));              // sub drop 160 -> 34hz
    ph+=2*Math.PI*f/sr;
    let x = Math.sin(ph) * .75 * Math.exp(-t*3.2);
    nz = nz*.55 + (Math.random()*2-1)*.45;                       // dull noise, rising then gone
    const nenv = t<.5 ? t/.5 : Math.max(0,1-(t-.5)/.5);
    x += nz * .3 * nenv;
    ph2+=2*Math.PI*(70-45*Math.min(1,t/.25))/sr;                 // thunk
    if(t<.3) x += Math.sin(ph2) * .5 * Math.exp(-t*14);
    if(i%HOLD===0) hold = Math.round(Math.max(-1,Math.min(1,x*1.4))*LEVELS)/LEVELS;
    d[i]=hold;
  }
  const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=buf; g.gain.value=.8;
  s.connect(g).connect(ac.destination); s.start();
}

/* light buzz: follows the flicker */
let buzzGain=null;
function startBuzz(){

    const og=ac.createGain(); og.gain.value=[1,.35,.18][i]; o.connect(og).connect(lp); o.start();

}

/* music: tries music/track.(mp3|ogg|wav), falls back to a synth techno loop */
let musicOn=false, musicAnalyser=null, beatSource=null, kickQueue=[], tempoGrid=null;
/* find a track's BPM and where its first kick lands: bass-band onset envelope at 200Hz, then score comb grids
   (every candidate tempo x phase) against it. returns { bpm, period, offset (s), conf } */
function analyseTempo(buf){
  const sr=buf.sampleRate, n=buf.length, a0=buf.getChannelData(0), a1=buf.numberOfChannels>1?buf.getChannelData(1):a0;
  const hop=Math.round(sr/200), L=Math.floor(n/hop), env=new Float32Array(L), a=1-Math.exp(-2*Math.PI*150/sr);
  let lp=0;
  for(let i=0;i<L;i++){ let e=0; for(let j=0;j<hop;j++){ lp += a*((a0[i*hop+j]+a1[i*hop+j])*.5 - lp); e += lp*lp; } env[i]=Math.sqrt(e/hop); }
  const on=new Float32Array(L);
  for(let i=6;i<L;i++){ let m=0; for(let k=1;k<=6;k++) m+=env[i-k]; on[i]=Math.max(0, env[i]-m/6); }
  let best={score:-1,bpm:0,offset:0,period:0}; const scores=[];
  for(let bpm=90; bpm<=160; bpm+=.25){
    const p=60/bpm*200;
    for(let o=0;o<p;o+=1){
      let sc=0, cnt=0; for(let t=o;t<L-1;t+=p){ sc+=on[Math.round(t)]; cnt++; }
      sc/=cnt; scores.push(sc);
      if(sc>best.score) best={score:sc,bpm,offset:o/200,period:60/bpm};
    }
  }
  scores.sort((x,y)=>x-y);
  return { bpm:best.bpm, period:best.period, offset:best.offset, conf:best.score/((scores[scores.length>>1])||1e-9) };
}
/* distance: the dry signal is pulled back and a long, dark, pre-delayed reverb tail carries the rest,
   so it sounds like it's playing in another room rather than straight at you */
function makeRoom(ctx, wetAmt=.55, dryAmt=.6){
  const input=ctx.createGain(), output=ctx.createGain();
  const dry=ctx.createGain(); dry.gain.value=dryAmt; input.connect(dry).connect(output);
  const pre=ctx.createDelay(.2); pre.delayTime.value=.045;
  const sr=ctx.sampleRate, len=Math.floor(sr*3.2), ir=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); let y=0;
    for(let i=0;i<len;i++){ const k=i/len, a=.55-.47*k; y += a*((Math.random()*2-1)*Math.pow(1-k,2.6)-y); d[i]=y*2.2; } }   // tail gets darker as it dies
  const conv=ctx.createConvolver(); conv.buffer=ir;
  const wet=ctx.createGain(); wet.gain.value=wetAmt;
  input.connect(pre).connect(conv).connect(wet).connect(output);
  return { input, output };
}
function mkAnalyser(node){ const an=ac.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.3; node.connect(an); musicAnalyser=an; }
/* the chain every real track goes through: tempo analysis, shelf, room, wall filter */
function playMusicBuffer(buf){
  const s=ac.createBufferSource(); s.buffer=buf; s.loop=true;
  const tm=analyseTempo(buf); window.__tempo=tm;
  /* heard through a wall: highs cut, lows lifted a little */
  const g=ac.createGain(); g.gain.value=.7;
  const lo=ac.createBiquadFilter(); lo.type='lowshelf'; lo.frequency.value=140; lo.gain.value=5;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000; lp.Q.value=.5;
  const room=makeRoom(ac,.55,.6);
  s.connect(lo); mkAnalyser(lo);                                    // fallback beat detection hears it before the reverb smears it
  lo.connect(room.input); room.output.connect(lp).connect(g).connect(ac.destination); s.start();
  if(tm.conf>1.6){ tempoGrid={ tStart:ac.currentTime, dur:buf.duration, period:tm.period, offset:tm.offset, last:-1 }; beatSource='grid'; }
  else beatSource='detect';                                         // couldn't lock a tempo: fall back to listening
}
async function startMusic(){
  if(!ac||musicOn) return; musicOn=true;
  if(!/[?&]synth/.test(location.search)){                           // ?synth forces the built-in track
    try { const rec = await idbGet('music'); if(rec){ playMusicBuffer(await ac.decodeAudioData(rec.data.slice(0))); return; } } catch(e){}
    for(const ext of ['mp3','ogg','wav']){
      try {
        const r=await fetch('music/track.'+ext); if(!r.ok) continue;
        playMusicBuffer(await ac.decodeAudioData(await r.arrayBuffer())); return;
      } catch(e){}
    }
  }
  if(musicMode==='legacy') legacySynth(); else synthTechno();
}
/* dark minimal techno, General Release-ish: hard saturated kick, offbeat hats, one clap, a rumble bass,
   a drone on a minor second (E/F), a lone stab, sidechain pumping, everything heard through a wall. */
function buildTechno(ctx, dest){
  const bpm=126, step=60/bpm/4, sr=ctx.sampleRate;
  const out=ctx.createGain(); out.gain.value=.6;
  const lo=ctx.createBiquadFilter(); lo.type='lowshelf'; lo.frequency.value=130; lo.gain.value=5;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1700; lp.Q.value=.6;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6;
  const room=makeRoom(ctx,.55,.6);
  out.connect(room.input); room.output.connect(lo).connect(lp).connect(comp).connect(dest);
  const lfo=ctx.createOscillator(), lfg=ctx.createGain(); lfo.frequency.value=.04; lfg.gain.value=350; lfo.connect(lfg).connect(lp.frequency); lfo.start();
  const nb=ctx.createBuffer(1,sr,sr), nd=nb.getChannelData(0); for(let i=0;i<sr;i++) nd[i]=Math.random()*2-1;
  const irLen=Math.floor(sr*2.2), ir=ctx.createBuffer(2,irLen,sr);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<irLen;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,3.2); }
  const verb=ctx.createConvolver(); verb.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.5; verb.connect(wet).connect(out);
  const duck=ctx.createGain(); duck.gain.value=1; duck.connect(out);                       // sidechain bus: bass + drone
  const curve=new Float32Array(1024); for(let i=0;i<1024;i++) curve[i]=Math.tanh((i/512-1)*3.2);
  /* drone: E2 against F2, always on */
  const pl=ctx.createBiquadFilter(); pl.type='lowpass'; pl.frequency.value=260; pl.Q.value=3;
  const pg=ctx.createGain(); pg.gain.value=.05; pl.connect(pg); pg.connect(duck); pg.connect(verb);
  [[82.41,-7],[82.41,7],[87.31,-4],[87.31,5]].forEach(([f,d])=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d; o.connect(pl); o.start(); });
  const roots=[41.2,41.2,41.2,43.65];                                                       // E1 x3, then F1 for the dissonant bar
  const noise=(t,len,type,freq,q,vol,toVerb)=>{
    const n=ctx.createBufferSource(); n.buffer=nb; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.003); g.gain.exponentialRampToValueAtTime(.0005,t+len);
    n.connect(f).connect(g); g.connect(out); if(toVerb) g.connect(verb); n.start(t,Math.random()*.5); n.stop(t+len+.02);
  };
  function kick(t){
    if(ctx===ac) kickQueue.push(t);                                                         // the light hits exactly when the kick does
    const o=ctx.createOscillator(), g=ctx.createGain(), sh=ctx.createWaveShaper(); sh.curve=curve;
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(38,t+.22);
    g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.45);
    o.connect(sh).connect(g).connect(out); o.start(t); o.stop(t+.5);
    noise(t,.025,'bandpass',3000,1,.18,false);
  }
  function rumble(t,f,len){
    const o=ctx.createOscillator(), l=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f;
    l.type='lowpass'; l.frequency.value=150; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.34,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+len);
    o.connect(l).connect(g).connect(duck); o.start(t); o.stop(t+len+.02);
  }
  function stab(t,f){
    const o=ctx.createOscillator(), l=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='square'; o.frequency.value=f;
    l.type='lowpass'; l.frequency.setValueAtTime(700,t); l.frequency.exponentialRampToValueAtTime(220,t+.3);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.09,t+.005); g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(l).connect(g); g.connect(out); g.connect(verb); o.start(t); o.stop(t+.4);
  }
  function step16(i,t){
    const s=i%16, bar=Math.floor(i/16)%4;
    if(s%4===0){ kick(t); duck.gain.cancelScheduledValues(t); duck.gain.setValueAtTime(.18,t); duck.gain.linearRampToValueAtTime(1,t+.32); }
    if(s%4===2) noise(t,.07,'highpass',6500,.7,.07,false);                                  // offbeat hat
    else if(s%2===1) noise(t,.03,'highpass',7500,.7,.02,false);                              // faint shaker
    if(s===4 || s===12) noise(t,.18,'bandpass',1400,1.2,.3,true);                            // clap into the room
    if(s%4===2) rumble(t, roots[bar], step*1.8);
    if(s===6 && bar%2===1) stab(t, bar===3 ? 174.6 : 164.8);                                 // E3, or F3 on the dark bar
  }
  return { step, step16, tap:out };
}
function synthTechno(){
  const T = buildTechno(ac, ac.destination); mkAnalyser(T.tap); beatSource='synth';
  let i=0, next=ac.currentTime+.1;
  setInterval(()=>{ while(next<ac.currentTime+.2){ T.step16(i,next); i++; next+=T.step; } },30);
}

/* the original track, kept as an option in Settings: 122bpm, offbeat bass, warm pad, no room */
function legacySynth(){
  const bpm=122, step=60/bpm/4;
  const master=ac.createGain(); master.gain.value=.55;
  const mlp=ac.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=3200;
  master.connect(mlp).connect(ac.destination); mkAnalyser(mlp); beatSource='synth';
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  /* pad */
  const pl=ac.createBiquadFilter(); pl.type='lowpass'; pl.frequency.value=500; pl.Q.value=4;
  const pg=ac.createGain(); pg.gain.value=.07; pl.connect(pg).connect(master);
  [110,130.8,164.8].forEach((f,i)=>[-6,6].forEach(d=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d; o.connect(pl); o.start(); }));
  const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.07; lg.gain.value=220; lfo.connect(lg).connect(pl.frequency); lfo.start();
  const roots=[55,55,58.27,49];
  function kick(t){ kickQueue.push(t); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(.95,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.connect(g).connect(master); o.start(t); o.stop(t+.45); }
  function hat(t,v,len){ const s=ac.createBufferSource(); s.buffer=nb; const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7500;
    const g=ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+len); s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t+len+.02); }
  function bass(t,f){ const o=ac.createOscillator(), lp=ac.createBiquadFilter(), g=ac.createGain(); o.type='sawtooth'; o.frequency.value=f;
    lp.type='lowpass'; lp.frequency.setValueAtTime(420,t); lp.frequency.exponentialRampToValueAtTime(90,t+.22);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.26); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+.3); }
  let i=0, next=ac.currentTime+.1;
  setInterval(()=>{
    while(next<ac.currentTime+.2){
      const s=i%16, bar=Math.floor(i/16)%4;
      if(s%4===0) kick(next);
      if(s%4===2){ hat(next,.16,.12); bass(next,roots[bar]); }
      else if(s%2===1) hat(next,.05,.04);
      i++; next+=step;
    }
  },30);
}

/* ---------- game ---------- */
const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const PRESETS = {1:15, 2:30, 3:45, 4:60, 5:107, 6:300};
const PRESET_KEYS = Object.keys(PRESETS);
let preset = 107, state='idle', dur=107, startT=0, beeps=0, nextBeep=0;
let stared=0, started=false;
let stats = { runs:0, psycho:0, stared:0, score:0, best:0 };
try { Object.assign(stats, JSON.parse(localStorage.getItem('mw-stats')||'{}')); } catch(e){}
const save = () => { try { localStorage.setItem('mw-stats', JSON.stringify(stats)); } catch(e){} };

function remaining(now){ return Math.max(0, dur - (now-startT)/1000); }
/* no UI while cooking: text only shows before a run (start hint) and after it (result) */
function setPrompt(){
  if(mp) ui.prompt = '';
  else if(state==='idle' && randomTime) ui.prompt = '[F] START\nTHE TIMER IS RANDOM\n[ESC] MENU';
  else if(state==='idle'){
    const it = k => `${PRESETS[k]===preset?'*':' '}[${k}] ${fmt(PRESETS[k])}`;
    ui.prompt = `[F] START   [<] [>] TIME\n${['1','2','3','4'].map(it).join(' ')}\n${['5','6'].map(it).join(' ')}\n[ESC] MENU`;
  }
  else if(state==='result') ui.prompt = '[R] REHEAT SOMETHING ELSE    [ESC] MENU';
  else ui.prompt = '';
}
function setStat(){
  ui.stat = `RUNS    ${stats.runs}\nPSYCHOS ${stats.psycho}\nSTARED  ${fmt(stats.stared)}\nSCORE   ${stats.score}`;
}
function applyPts(p){            // solo only: online scores are kept by the host
  if(mp) return;
  stats.score += p; stats.best = Math.max(stats.best, p); save(); setStat();
}
function startRun(forceDur){
  if(state!=='idle' || !started) return;
  dur = forceDur || (randomTime ? 15 + Math.floor(Math.random()*166) : preset);   // solo random: 15 s to 3 min
  startT = performance.now(); state='running'; stared=0;
  ui.msg='';
  if(!sfxBuf.mw_hum) sfx('mw_start',1,()=>{ thunk(110,.1,.4); beep(1800,.08,.08); }); // the real start-up is the head of mw_hum
  cookStart();
  setPrompt();
}
function endRun(now){            // the timer hit zero: the -5 lands now, the alarm starts
  state='done'; beeps=0; nextBeep=now; cookStop(); applyPts(END_PENALTY); emitEv('end',END_PENALTY,0); setPrompt();
}
function openDoor(){
  const now = performance.now();
  if(state==='running'){
    if(dur - (now-startT)/1000 <= 0){ endRun(now); finish(0, 0, true); return; }   // too late, even if the frame hasn't noticed yet
    const rem = remaining(now); finish(Math.ceil(rem), rem, false);
  }
  else if(state==='done') finish(0, 0, true);
}
/* result lines: one pool per outcome, never the same line twice in a row */

const lastLine = {};
function pick(cat, args){
  const pool = LINES[cat]; let i;
  do { i = (Math.random()*pool.length)|0; } while(pool.length>1 && i===lastLine[cat]);
  lastLine[cat] = i; return pool[i](args);
}
function finish(leftDisp, rem, wasDone){
  state='result'; mws[me].doorTarget=1; cookStop();
  sfx('mw_door_open',1,()=>doorOpenSynth());                          // always on the real open (your own sfx/mw_door_open.* wins)
  if(!mp){ stats.runs++; stats.stared += Math.round(stared); }
  let pts, m;
  if(wasDone){ pts = END_PENALTY; emitEv('door',0,0); }          // the -5 was applied when the timer hit zero
  else { pts = pointsFor(rem); applyPts(pts); emitEv('open',pts,rem); }
  if(!wasDone){
    const elapsed = 1 - leftDisp/dur;
    if(leftDisp===1){ if(!mp) stats.psycho++; m = pick('psycho', {left:leftDisp}); }
    else if(leftDisp<=3) m = pick('close', {left:leftDisp});
    else if(leftDisp>=dur-2) m = pick('immediate', {left:leftDisp});
    else if(elapsed<.25) m = pick('barely', {left:leftDisp});
    else if(elapsed>.75) m = pick('almost', {left:leftDisp});
    else m = pick('early', {left:leftDisp});
  } else {
    const per = (sfxBuf.mw_alarm||sfxBuf.mw_end) ? 4 : sfxBuf.mw_ding ? 3 : 1;
    const n = beeps*per;
    if(beeps<=1) m = pick('quick', {n});
    else if(beeps<=3) m = pick('late', {n});
    else m = pick('ghost', {n});
  }
  ui.msg = m + `\n${pts>0?'+':''}${pts} POINTS`;
  save(); setStat(); setPrompt();
  setTimeout(()=>sfx(!wasDone && leftDisp===1 ? 'result_psychopath' : 'result_weak', .9), 600);
}
function reset(){
  if(state!=='result' || mp) return;
  mws[me].doorTarget=0; state='idle'; ui.msg=''; sfx('mw_door_close',1,()=>doorCloseSynth());
  spinner.rotation.y=0; setPrompt();
}

/* ---------- online: PeerJS (WebRTC data channels), star around the host ---------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const randCode = () => Array.from({length:4},()=>CODE_CHARS[(Math.random()*CODE_CHARS.length)|0]).join('');
const peerOK = () => typeof Peer !== 'undefined';
const sendTo = (c,m) => { try{ if(c && c.open) c.send(m); }catch(e){} };
const broadcast = (m, except) => net.conns.forEach(c=>{ if(c!==except) sendTo(c,m); });

function leaveRoom(){
  try{ clearTimeout(net.roundTimer); net.peer && net.peer.destroy(); }catch(e){}
  Object.assign(net, { role:null, peer:null, conns:[], hostConn:null, pid:null, code:'', players:[], lobby:[], started:false, nextId:0 });
  netStatus=''; menuView='main';
}
function lobbyBroadcast(){ const pids = net.players.map(p=>p.pid); net.lobby = pids; broadcast({t:'lobby', pids}); }

function hostRoom(tries=0){
  if(!peerOK()){ netStatus='NO NETWORK (CANNOT LOAD PEERJS)'; return; }
  net.code = randCode(); net.role='host'; net.pid='p0'; net.players=[{pid:'p0',conn:null}]; net.conns=[]; net.started=false;
  netStatus='OPENING ROOM...'; menuView='lobby';
  const peer = new Peer('mwsim-'+net.code); net.peer = peer;
  peer.on('open', ()=>{ netStatus=''; });
  peer.on('error', e=>{
    if(e.type==='unavailable-id' && tries<5){ try{peer.destroy();}catch(_){} hostRoom(tries+1); }
    else { netStatus='ERROR: '+String(e.type).toUpperCase(); }
  });
  peer.on('connection', c=>{
    c.on('open', ()=>{
      if(net.started || net.players.length>=4){ sendTo(c,{t:'full'}); setTimeout(()=>{ try{c.close();}catch(_){} },300); return; }
      const pid = 'p'+(++net.nextId); c.__pid = pid; net.conns.push(c); net.players.push({pid, conn:c});
      sendTo(c,{t:'welcome', pid}); lobbyBroadcast();
    });
    c.on('data', m=>hostOnData(c,m));
    c.on('close', ()=>hostPeerLeft(c)); c.on('error', ()=>hostPeerLeft(c));
  });
}
function hostPeerLeft(c){
  const pid = c.__pid; if(!pid || c.__left) return; c.__left = true;
  net.conns = net.conns.filter(x=>x!==c);
  if(!net.started){ net.players = net.players.filter(p=>p.pid!==pid); lobbyBroadcast(); return; }
  net.resolved[pid] = true; if(net.rpts[pid]===undefined) net.rpts[pid]=0;
  broadcast({t:'gone', pid}); markGone(pid); checkRoundEnd();
}
function hostOnData(c,m){
  if(!m || m.t!=='ev') return;
  m.pid = c.__pid; hostBook(m); onEvVisual(m); broadcast(m, c);      // relay to everyone else
}
function hostStart(){
  if(net.role!=='host' || net.players.length<2 || net.started) return;
  net.started = true; net.order = net.players.map(p=>p.pid); net.rounds = 5; net.round = 0; net.tot = {};
  broadcast({t:'start', order:net.order, rounds:net.rounds});
  startMatch();
}
function joinRoom(code){
  if(!peerOK()){ netStatus='NO NETWORK (CANNOT LOAD PEERJS)'; return; }
  net.role='client'; netStatus='CONNECTING...';
  const peer = new Peer(); net.peer = peer;
  const fail = s => { netStatus=s; try{peer.destroy();}catch(_){} net.role=null; net.peer=null; };
  const to = setTimeout(()=>{ if(menuView==='join') fail('COULD NOT CONNECT'); }, 15000);
  peer.on('error', e=>{ clearTimeout(to); fail(e.type==='peer-unavailable' ? 'NO SUCH ROOM' : 'ERROR: '+String(e.type).toUpperCase()); });
  peer.on('open', ()=>{
    const c = peer.connect('mwsim-'+code, {reliable:true}); net.hostConn = c;
    c.on('open', ()=>{ clearTimeout(to); netStatus=''; menuView='lobby'; net.code=code; });
    c.on('data', clientOnData);
    c.on('close', hostLeft); c.on('error', ()=>{});
  });
}
function hostLeft(){
  if(net.started){ net.dead = true; return; }
  const was = menuView; leaveRoom(); menuView='main'; if(was==='lobby') netStatus='THE HOST LEFT';
}
function clientOnData(m){
  if(!m) return;
  if(m.t==='welcome') net.pid = m.pid;
  else if(m.t==='lobby') net.lobby = m.pids;
  else if(m.t==='full'){ netStatus='ROOM IS FULL'; menuView='join'; try{net.peer.destroy();}catch(e){} net.role=null; }
  else if(m.t==='start'){ net.order=m.order; net.rounds=m.rounds; net.started=true; net.tot={}; startMatch(); }
  else if(m.t==='round') beginRound(m);
  else if(m.t==='ev') onEvVisual(m);
  else if(m.t==='rend') onRend(m);
  else if(m.t==='gone') markGone(m.pid);
}
/* local result -> everyone else (and the host's books) */
function emitEv(k, pts, rem){
  if(!mp) return;
  const m = { t:'ev', pid:net.pid, k, pts, rem };
  if(net.role==='host'){ hostBook(m); broadcast(m); } else sendTo(net.hostConn, m);
}
function hostBook(m){
  if((m.k==='open' || m.k==='end') && !net.resolved[m.pid]){ net.resolved[m.pid]=true; net.rpts[m.pid]=m.pts; checkRoundEnd(); }
}
/* what the other microwaves do on your screen */
function onEvVisual(m){
  const i = net.order.indexOf(m.pid); if(i<0 || i===me || !mws[i]) return;
  const mw = mws[i];
  if(m.k==='open' || m.k==='door'){ mw.rs.phase='opened'; mw.doorTarget=1; sfx('mw_door_open',.3,()=>doorOpenSynth(.3)); }
  else if(m.k==='end' && mw.rs.phase!=='opened'){ mw.rs.phase='ended'; }
}
function markGone(pid){
  const i = net.order.indexOf(pid); if(i<0 || i===me || !mws[i]) return;
  mws[i].rs.phase='gone'; mws[i].doorTarget=1;
}
function startMatch(){
  mp = { n:net.order.length, me:net.order.indexOf(net.pid) };
  buildLayout(mp.n, mp.me);
  play();
}
function hostNextRound(){
  if(net.role!=='host' || net.dead) return;
  net.round++; net.resolved={}; net.rpts={}; net.ending=false;
  const durs = {}, used = [];
  net.order.forEach(pid=>{
    let d, guard=0;
    do { d = 15 + ((Math.random()*61)|0); guard++; } while(used.some(u=>Math.abs(u-d)<4) && guard<60);
    used.push(d); durs[pid]=d;
  });
  const m = { t:'round', n:net.round, rounds:net.rounds, durs };
  broadcast(m); beginRound(m);
}
function beginRound(m){
  net.round = m.n; net.rounds = m.rounds;
  ui.board = null; ui.msg = '';
  net.order.forEach((pid,i)=>{
    const mw = mws[i]; mw.doorTarget=0; mw.spinner.rotation.y=0;
    mw.rs = { phase:'run', dur:m.durs[pid], startT:performance.now(), nextBeep:0 };
  });
  cookStop(); state='idle'; started=true;
  startRun(m.durs[net.pid]);
}
function checkRoundEnd(){
  if(net.ending || !net.order.every(pid=>net.resolved[pid])) return;
  net.ending = true; clearTimeout(net.roundTimer); net.roundTimer = setTimeout(hostRoundEnd, 2200);
}
function hostRoundEnd(){
  const pts = {};
  net.order.forEach(pid=>{ pts[pid] = net.rpts[pid]||0; net.tot[pid] = (net.tot[pid]||0) + pts[pid]; });
  const final = net.round >= net.rounds;
  const m = { t:'rend', n:net.round, rounds:net.rounds, pts, tot:{...net.tot}, final };
  broadcast(m); onRend(m);
  if(!final) net.roundTimer = setTimeout(hostNextRound, 9000);
}
function onRend(m){
  mws.forEach(mw=>{ mw.doorTarget=1; });
  if(state==='running' || state==='done'){ cookStop(); }
  state='result'; ui.msg='';
  ui.board = { round:m.n, rounds:m.rounds, final:m.final,
    rows: net.order.map((pid,i)=>({ i, name:COLS[i].n, pts:m.pts[pid]||0, tot:m.tot[pid]||0, me:i===me })) };
}

/* ---------- custom music: stored in this browser (IndexedDB), never uploaded ---------- */
const idb = () => new Promise((res,rej)=>{ const q=indexedDB.open('mw-settings',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
const idbOp = async (mode, fn) => { const db=await idb(); return new Promise((res,rej)=>{ const r=fn(db.transaction('kv',mode).objectStore('kv')); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); };
const idbGet = k => idbOp('readonly', st=>st.get(k));
const idbSet = (k,v) => idbOp('readwrite', st=>st.put(v,k));
const idbDel = k => idbOp('readwrite', st=>st.delete(k));
const fileIn = document.createElement('input');
fileIn.type='file'; fileIn.accept='audio/*,.mp3,.wav,.ogg,.m4a,.flac'; fileIn.style.display='none'; document.body.appendChild(fileIn);
fileIn.addEventListener('change', async ()=>{
  const f = fileIn.files[0]; fileIn.value=''; if(!f) return;
  if(f.size > 40*1024*1024){ settingsMsg='FILE TOO BIG (40 MB MAX)'; return; }
  settingsMsg='READING...';
  try {
    const data = await f.arrayBuffer();
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const buf = await new OAC(2,44100,44100).decodeAudioData(data.slice(0));       // proves it's playable
    const tm = analyseTempo(buf);
    await idbSet('music', { name:f.name, data });
    customInfo = { name:f.name, bpm:Math.round(tm.bpm) };
    settingsMsg = tm.conf>1.6 ? 'SAVED. THE LIGHTS WILL LOCK TO IT.' : 'SAVED. TEMPO UNCLEAR, LIGHTS WILL LISTEN.';
  } catch(e){ settingsMsg='COULD NOT READ THAT FILE'; }
});
idbGet('music').then(rec=>{ if(rec) customInfo = { name:rec.name, bpm:0 }; if(rec){ try{ const OAC=window.OfflineAudioContext; new OAC(2,44100,44100).decodeAudioData(rec.data.slice(0)).then(b=>{ customInfo.bpm=Math.round(analyseTempo(b).bpm); }); }catch(e){} } }).catch(()=>{});
function settingsAction(k){
  if(k==='u') fileIn.click();
  else if(k==='c' && customInfo){ idbDel('music').catch(()=>{}); customInfo=null; settingsMsg='BACK TO THE BUILT-IN TRACK'; }
  else if(k==='t'){ randomTime=!randomTime; try{ localStorage.setItem('mw-random-time', randomTime?'on':'off'); }catch(e){} settingsMsg = randomTime ? 'SOLO TIMER IS RANDOM' : 'SOLO: YOU PICK THE TIME'; setPrompt(); }
  else if(k==='l'){ musicMode = musicMode==='legacy' ? 'new' : 'legacy'; try{ localStorage.setItem('mw-music-mode', musicMode); }catch(e){} settingsMsg = musicMode==='legacy' ? 'LEGACY SYNTH. PLAYS NEXT GAME.' : 'NEW SYNTH. PLAYS NEXT GAME.'; }
}

/* ---------- input ---------- */
let escUntil=0, toastT=null;
function leaveToMenu(){               // back to the main menu (a reload: clean state, music and room dropped)
  const now = performance.now();
  if(mp && now>escUntil){ escUntil=now+2500; ui.toast='PRESS ESC AGAIN TO LEAVE THE MATCH'; clearTimeout(toastT); toastT=setTimeout(()=>{ ui.toast=''; },2500); return; }
  location.reload();
}
function menuAction(k){
  if(k==='p') startSolo();
  else if(k==='h') hostRoom();
  else if(k==='j'){ menuView='join'; joinCode=''; netStatus=''; }
  else if(k==='i') menuView='help';
  else if(k==='s'){ menuView='settings'; settingsMsg=''; }
}
function menuKey(e, k){
  if(menuView==='main'){
    if(k==='enter' || k===' ' || k==='p'){ e.preventDefault(); menuAction('p'); }
    else if(k==='h' || k==='j' || k==='i' || k==='s') menuAction(k);
  } else if(menuView==='settings'){
    if(k==='escape') menuView='main'; else settingsAction(k);
  } else if(menuView==='help'){
    if(k==='escape' || k==='enter' || k==='backspace') menuView='main';
  } else if(menuView==='join'){
    if(k==='escape'){ menuView='main'; netStatus=''; }
    else if(k==='backspace') joinCode = joinCode.slice(0,-1);
    else if(k==='enter'){ if(joinCode.length===4) joinRoom(joinCode); }
    else if(/^[a-z]$/.test(k) && joinCode.length<4) joinCode += k.toUpperCase();
  } else if(menuView==='lobby'){
    if(k==='escape') leaveRoom();
    else if(k==='enter') hostStart();
  }
}
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(phase==='menu'){ if(ac) ac.resume().then(menuAmbStart); menuKey(e,k); return; }
  if(k==='escape'){ e.preventDefault(); leaveToMenu(); return; }
  if(!started) return;
  if(mp){
    if(k==='e' || k===' '){ e.preventDefault(); openDoor(); }
    else if(k==='enter' && ((ui.board && ui.board.final) || net.dead)) location.reload();
    return;
  }
  if(k==='f'||k==='enter') startRun();
  else if(k==='e'||k===' ') { e.preventDefault(); openDoor(); }
  else if(k==='r') reset();
  else if(state==='idle' && !randomTime && (PRESETS[k] || k==='arrowleft' || k==='arrowright' || k==='a' || k==='d')){
    if(PRESETS[k]) preset=PRESETS[k];
    else { const i=PRESET_KEYS.findIndex(q=>PRESETS[q]===preset), n=PRESET_KEYS.length, dir=(k==='arrowleft'||k==='a')?-1:1;
           preset=PRESETS[PRESET_KEYS[(i+dir+n)%n]]; }
    setPrompt(); sfx('mw_key',.8,()=>thunk(140,.05,.2));
  }
});
addEventListener('pointerdown', e=>{
  if(phase==='menu'){
    const y = e.clientY/innerHeight*RTH;
    if(menuView==='main'){ const i = menuRowAt(y); if(i>=0){ if(ac) ac.resume().then(menuAmbStart); menuAction(MENU_ITEMS[i][0]); } }
    else if(menuView==='help') menuView='main';
    else if(menuView==='settings'){ const k = settingsRowAt(y); if(k==='escape') menuView='main'; else if(k) settingsAction(k); }
    else if(menuView==='lobby' && y>RTH*.76 && y<RTH*.86) hostStart();
    return;
  }
  if(!started) return;
  if(mp){
    if((ui.board && ui.board.final) || net.dead) location.reload();
    else openDoor();
    return;
  }
  if(state==='idle') startRun(); else if(state==='running'||state==='done') openDoor(); else reset();
});
let mx=0,my=0;
addEventListener('pointermove', e=>{
  mx=e.clientX/innerWidth*2-1; my=e.clientY/innerHeight*2-1;
  menuHover = (phase==='menu' && menuView==='main') ? menuRowAt(e.clientY/innerHeight*RTH) : -1;
  document.body.style.cursor = menuHover>=0 ? 'pointer' : 'default';
});
addEventListener('beforeunload', ()=>{ try{ net.peer && net.peer.destroy(); }catch(e){} });

/* menu -> dissolve (1s) -> black (4s) -> lights, buzz and music slam in */
let live=false, liveAt=0, phase='menu', dissolveAt=0;
function startSolo(){ mp=null; buildLayout(1,0); setPrompt(); setStat(); play(); }
function play(){
  if(phase!=='menu') return;
  phase='dissolve'; dissolveAt=performance.now(); audioInit(); if(ac&&ac.state==='suspended') ac.resume();
  menuAmbStop(); menuSfx();
  setTimeout(()=>{ phase='black'; }, 1000);
  setTimeout(()=>{
    phase='live'; live=true; liveAt=performance.now(); started=true;
    startMusic(); startAmbient(); startBuzz();
    if(mp && net.role==='host') setTimeout(hostNextRound, 1800);
  }, 5000); // 1s dissolve + 4s of black
}

/* creep events */
let creepAt = performance.now()+ 15000 + Math.random()*20000, creep=null;
let fridgeAt = performance.now()+ 40000, fridgeOn=false;
/* beat from the music itself (bass energy jumping over its running average), so it works for any track */
let beatLvl=0, flashLvl=0, beatAvg=0, lastBeat=0; const beatBuf=new Uint8Array(512);
function beatTick(now, dt){
  let hit=false;
  const lat = ac ? (ac.outputLatency || ac.baseLatency || 0) : 0;           // so the light lands when you hear it, not when it was rendered
  if(beatSource==='synth' && ac){
    const cur = ac.currentTime - lat;
    while(kickQueue.length && kickQueue[0] <= cur){ kickQueue.shift(); hit=true; }
  } else if(beatSource==='grid' && ac && tempoGrid){
    const pos = ac.currentTime - lat - tempoGrid.tStart;
    if(pos>=0){
      const lpos = pos % tempoGrid.dur, loop = Math.floor(pos/tempoGrid.dur);
      if(lpos >= tempoGrid.offset){
        const id = loop*100000 + Math.floor((lpos-tempoGrid.offset)/tempoGrid.period);
        if(id!==tempoGrid.last){ tempoGrid.last=id; hit=true; }
      }
    }
  } else if(musicAnalyser){                                                   // fallback: listen for bass hits
    musicAnalyser.getByteFrequencyData(beatBuf);
    let e=0; for(let i=1;i<=5;i++) e+=beatBuf[i]; e/=5;
    beatAvg += (e-beatAvg)*Math.min(1,dt*1.5);
    if(e>beatAvg*1.2 && e>60 && now-lastBeat>230){ lastBeat=now; hit=true; }
  } else if(QUIET && live){                                                   // dev: no audio, so fake a 126bpm pulse
    const per=60/126; if(((now/1000)%per) < dt) hit=true;
  }
  if(hit){ beatLvl=1; flashLvl=1; }
  beatLvl *= Math.exp(-dt*9); flashLvl *= Math.exp(-dt*4.5);
  if(/[?&]flash/.test(location.search)){ beatLvl = 1; const m=window.__flashPhase!==undefined ? window.__flashPhase : (((now/1000)%1.2)/1.2); flashLvl = 1-m; }           // dev: loop the flash, or pin it with window.__flashPhase (0..1)
  const v = live ? beatLvl : 0;
  window.__beat = beatLvl;                                   // read-only debug tap
  const fv = live ? flashLvl : 0;
  drawFlash(fv); partyMat.opacity = fv>.01 ? .9 : 0; partyLight.intensity = v*.8;
}

setPrompt(); setStat(); resize(); addEventListener('resize', resize);
audioInit(); if(ac) ac.onstatechange=()=>menuAmbStart(); menuAmbStart();
if(QUIET){
  window.__mw = { net, mws, get mp(){return mp}, get state(){return state}, get phase(){return phase}, get menuView(){return menuView},
    get netStatus(){return netStatus}, key:k=>dispatchEvent(new KeyboardEvent('keydown',{key:k})), hostRoom, joinRoom, hostStart, buildTechno, analyseTempo, fileIn, get customInfo(){return customInfo}, get settingsMsg(){return settingsMsg} };
  if(!/[?&]menu/.test(location.search)) startSolo();
}

/* ---------- loop ---------- */
let prev = performance.now(), progressSmooth=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.1,(now-prev)/1000); prev=now;
  const t = now/1000;
  const L = mws[me];

  let progress = 0;
  if(state==='running'){
    const rem = remaining(now);
    stared += dt;
    progress = 1 - rem/dur;
    drawDisplay(fmt(Math.ceil(rem)), true, L);
    spinner.rotation.y += dt*.9;
    if(rem<=0) endRun(now);
    else if(Math.random() < dt*.4) sfx('food_pop', .5);
  } else if(state==='done'){
    progress = 1; stared += dt;
    drawDisplay('0:00', Math.floor(t*2)%2===0, L);
    if(now>=nextBeep){
      beeps++;
      if(sfxBuf.mw_alarm || sfxBuf.mw_end){ playAlarm(); nextBeep=now+8000; }
      else if(sfxBuf.mw_ding){ [0,850,1700].forEach(d=>setTimeout(()=>sfx('mw_ding',.9),d)); nextBeep=now+5200; }
      else { beep(2300,.14,.12); setTimeout(()=>beep(2300,.14,.12),220); setTimeout(()=>beep(2300,.14,.12),440); nextBeep=now+3200; }
    }
  } else if(state==='idle'){
    drawDisplay((mp || randomTime) ? '--:--' : fmt(preset), true, L);
  } else {
    drawDisplay('--:--', Math.floor(t*1.5)%2===0, L);
  }
  progressSmooth += (progress-progressSmooth)*Math.min(1,dt*2);

  /* every microwave: other players' timers, doors, interior light */
  mws.forEach((mw,i)=>{
    const mine = i===me, rs = mw.rs;
    if(!mine){
      if(rs.phase==='run'){
        const rem = Math.max(0, rs.dur-(now-rs.startT)/1000);
        drawDisplay(fmt(Math.ceil(rem)), true, mw); mw.spinner.rotation.y += dt*.9;
        if(rem<=0){ rs.phase='ended'; rs.nextBeep=now; }
      } else if(rs.phase==='ended'){
        drawDisplay('0:00', Math.floor(t*2)%2===0, mw);
        if(now>=rs.nextBeep){ rs.nextBeep=now+5200; beep(2000,.12,.03); }
      } else if(rs.phase==='opened' || rs.phase==='gone') drawDisplay('--:--', false, mw);
      else drawDisplay('--:--', true, mw);
    }
    mw.doorOpen += (mw.doorTarget-mw.doorOpen)*Math.min(1,dt*7);
    mw.door.rotation.y = -1.95*mw.doorOpen;
    const lit = mine ? (state==='running'||state==='done') : (rs.phase==='run'||rs.phase==='ended');
    const flick = (mine ? state==='running' : rs.phase==='run') ? (.9 + Math.random()*.15) : 1;
    const want = mw.doorTarget>0 ? .7 : (lit ? 1.35*flick : 0);
    mw.inLight.intensity += (want - mw.inLight.intensity)*Math.min(1,dt*10);
  });
  if(humGain) humGain.gain.value += ((state==='running' && !sfxBuf.mw_hum ? .09:0)-humGain.gain.value)*Math.min(1,dt*8);
  if(hum) hum.frequency.value = 118 + (state==='running'? Math.sin(t*3)*1.5 : 0);

  /* creep: flicker, silhouette */
  if(!creep && now>creepAt && live){
    creep={t0:now, fig:Math.random()<.4}; sfx('light_flicker',.8);
    if(creep.fig) setTimeout(()=>sfx('creep_stinger',1),550);
  }
  if(live && now>fridgeAt){ fridgeOn=!fridgeOn; sfx(fridgeOn?'fridge_compressor_on':'fridge_compressor_off',.7); fridgeAt=now+30000+Math.random()*50000; }
  let lightMul=1;
  if(creep){
    const e=(now-creep.t0)/1000;
    if(e<.55){ lightMul = Math.random()<.5? .05 : 1; fig.visible = creep.fig && lightMul<.5; }
    else if(creep.fig && e<2.4){ fig.visible=true; lightMul=.85; }
    else { fig.visible=false; creep=null; creepAt = now+ 20000 + Math.random()*35000; }
  }
  /* steady flicker: new target every 30-130ms, occasional deep dip; startup stutters */
  flickNext -= dt;
  if(flickNext<=0){ flickNext=.03+Math.random()*.1; flickTarget = Math.random()<.12 ? .22+Math.random()*.28 : .78+Math.random()*.22; }
  fl += (flickTarget-fl)*Math.min(1,dt*30);
  let flEff = 0;
  if(live){
    const boot = Math.min(1,(now-liveAt)/1400);
    flEff = fl * (Math.random()<boot ? 1 : .04);
  }
  const lm = lightMul*flEff;
  ambient.intensity = .38*lm; lamp.intensity = 1.0*lm; moon.intensity = .3*lm;
  dispLight.intensity = live ? .5*(.75+.25*flEff) : 0;
  if(live) mws.forEach(mw=>mw.disp.plane.material.color.setScalar(.8+.2*flEff));
  if(buzzGain) buzzGain.gain.value = .008 + .03*flEff + (flEff<.5 ? .02 : 0);

  beatTick(now, dt);

  /* camera: sway and parallax; pulls back to fit every player's microwave */
  /* pull back until the whole row of microwaves fits the window, whatever its shape */
  const fitZ = mws.length>1 ? ((mws.length-1)*.62+.95) / (2*Math.tan(cam.fov*Math.PI/360)*cam.aspect) : 0;
  const camZ = Math.max(camBaseZ, fitZ) * (1 - (mp ? .05 : .13)*progressSmooth);      // creeps in as the timer runs down
  /* idle: a slow breath (about 6s), a very slow drift, and a faint tilt rocking left to right */
  const TAU=Math.PI*2, breath=Math.sin(t*TAU/6.2)+.3*Math.sin(t*TAU/3.1+.8);
  const drift=Math.sin(t*TAU/23), roll=Math.sin(t*TAU/17)*.014 + Math.sin(t*TAU/9.3+1.2)*.004;
  cam.position.set(mx*.06 + drift*.02, 1.14 + breath*.006 - my*.02, camZ + breath*.005);
  cam.lookAt(.02 + mx*.03 + drift*.015, 1.08 - my*.015 + breath*.003, 0);
  cam.rotateZ(roll);

  postMat.uniforms.time.value = t;
  postMat.uniforms.mA.value = phase==='menu' ? 1 : phase==='dissolve' ? Math.max(0,1-(now-dissolveAt)/1000) : 0;
  postMat.uniforms.blk.value = phase==='live' ? 0 : 1;
  if(phase==='menu'||phase==='dissolve') drawMenu(rt.width, t);
  drawHud(rt.width);
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(post, postCam);
}
requestAnimationFrame(frame);
})();
</script>
